# ScratchBird Single Node Manager public standalone configuration template.
#
# This template uses the exact keys parsed by sbmn_manager. Paths are relative
# so source-tree validation cannot write outside the caller's chosen workspace.

manager.release.profile = enterprise
manager.runtime_dir = runtime/manager/runtime
manager.control_dir = runtime/manager/control
manager.log.path = stderr
manager.log.level = info

manager.proxy.enabled = false
manager.proxy.bind = 127.0.0.1
manager.proxy.port = 3092
manager.proxy.backlog = 64
manager.proxy.max_clients = 128
manager.proxy.client_idle_timeout_ms = 30000
manager.proxy.backend_connect_timeout_ms = 3000
manager.proxy.io_timeout_ms = 30000
manager.proxy.tls_required = true

manager.control.backlog = 64
manager.control.max_clients = 32
manager.control.max_payload_bytes = 1048576
manager.control.idle_timeout_ms = 30000

manager.backend.native_bind = 127.0.0.1
manager.backend.native_port = 3092

manager.owner.database_name = default
manager.owner.database_path = runtime/databases/default.sbdb
manager.listener.default_id = 1

manager.dbbt.ttl_ms = 30000
manager.dbbt.clock_skew_ms = 5000
manager.dbbt.replay_cache_entries = 4096

manager.server.heartbeat_interval_ms = 1000
manager.server.heartbeat_timeout_ms = 3000
manager.server.missed_heartbeat_threshold = 3
manager.server.restart.enabled = true
manager.server.restart.max_attempts = 5
manager.server.restart.window_ms = 60000
manager.server.restart.initial_backoff_ms = 250
manager.server.restart.max_backoff_ms = 5000

manager.third_party.enabled = false
manager.threading.no_spin_required = true
