# Create/import input only. Never a runtime fallback or authorization grant.
# Durations are unsigned seconds. Names are annotations, not object identities.
[config]
schema = scratchbird_metric_policy_v1

[operational_defaults]
policy_name = metrics_operational_default_v1
scope = database
mode = raw_and_rollup
raw_retention_seconds = 1209600
rollup_retention_seconds = 34560000
rollup_grains = 1m,1h,1d
purge_batch_limit = 1024
max_cardinality = 4096
overflow_behavior = reject_and_evidence
edit_right = OBS_METRICS_RETENTION_CONTROL
default_admin_group = OPS
evidence_required = true
read_right = OBS_METRICS_READ_DATABASE
sensitive_labels = redact
