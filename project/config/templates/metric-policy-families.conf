# Exact create/import family selection; no wildcard or prefix fallback.
# Security/audit and cluster families do not inherit operational defaults.
# Explicit governing family requirements always take precedence over this file.
[config]
schema = scratchbird_metric_policy_v1

[sb_tx_begin_total]
profile = operational

[sb_tx_commit_total]
profile = operational

[sb_mga_cleanup_horizon_local_transaction_id]
profile = operational

[sb_metric_samples_rejected_total]
profile = operational

# Fully explicit rows do not inherit later changes to the operational defaults.
[sb_tx_active_transactions]
profile = explicit
policy_name = metrics_tx_active_v1
scope = database
mode = raw_and_rollup
raw_retention_seconds = 1209600
rollup_retention_seconds = 34560000
rollup_grains = 1m,1h,1d
purge_batch_limit = 1024
max_cardinality = 1024
overflow_behavior = reject_and_evidence
edit_right = OBS_METRICS_RETENTION_CONTROL
default_admin_group = OPS
evidence_required = true
read_right = OBS_METRICS_READ_DATABASE
sensitive_labels = redact

[sb_filespace_used_bytes]
profile = explicit
policy_name = metrics_filespace_used_v1
scope = database
mode = raw_and_rollup
raw_retention_seconds = 2592000
rollup_retention_seconds = 34560000
rollup_grains = 1m,1h,1d
purge_batch_limit = 1024
max_cardinality = 4096
overflow_behavior = reject_and_evidence
edit_right = OBS_METRICS_RETENTION_CONTROL
default_admin_group = OPS
evidence_required = true
read_right = OBS_METRICS_READ_FAMILY
sensitive_labels = redact
