events {}

http {
    access_log /dev/stdout;
    error_log /dev/stderr notice;

    server {
        listen 443 ssl;
        server_name mtls.scratchbird.test;

        ssl_certificate /pki/mtls.crt;
        ssl_certificate_key /pki/mtls.key;
        ssl_client_certificate /pki/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 3;
        ssl_crl /pki/ca.crl.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        location = /identity {
            default_type application/json;
            return 200 '{"verified":"$ssl_client_verify","subject":"$ssl_client_s_dn","issuer":"$ssl_client_i_dn","serial":"$ssl_client_serial"}\n';
        }
    }
}
