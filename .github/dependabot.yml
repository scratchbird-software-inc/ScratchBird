version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Toronto
    # Keep the configuration present for auditability, but do not open
    # automated action-version PRs while release CI is gated for gold builds.
    open-pull-requests-limit: 0
