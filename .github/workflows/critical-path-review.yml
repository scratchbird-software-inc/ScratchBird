name: Critical path review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - edited
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: critical-path-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  independent-review:
    name: Critical path independent review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # pull_request_target is deliberate: this checks out only trusted policy
      # from the default branch and never executes pull-request-controlled code.
      - name: Checkout trusted review policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Evaluate and publish review status on the PR head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SB_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 project/tools/ci/critical_path_review_gate.py \
            --repository "$GITHUB_REPOSITORY" \
            --pull-request "$SB_PULL_REQUEST_NUMBER" \
            --publish-status
