name: ScratchBird macOS CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      architecture:
        description: macOS architecture to build
        required: true
        default: all
        type: choice
        options:
          - all
          - x86_64
          - arm64
      include_system_packages:
        description: Build and smoke internal-only PKG diagnostics; never publish the PKG
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}-${{ inputs.architecture || 'all' }}
  cancel-in-progress: true

env:
  SB_CI_RELEASE_LABELS: "^(public_release_correctness|engine_listener_enterprise)$"
  SB_CI_PROCESS_LABELS: "^(integration|e2e|live_server|process_kill|database_lifecycle_server_route)$"
  SB_MACOS_CTEST_PLATFORM_EXCLUDE: "^(linux_proof|linux_source_proof|mingw_cross_compile|windows|freebsd|bsd)$"

jobs:
  static-policy:
    name: macOS repository and static policy
    if: ${{ github.event_name != 'pull_request' || vars.SB_MACOS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repository and static release gates
        run: |
          mkdir -p build/ci-logs/macos-static
          set -o pipefail
          {
            status=0
            python3 project/tools/release/public_packaging_history_gate.py || status=1
            python3 project/tools/release/github_actions_static_gate.py || status=1
            python3 project/tools/release/public_private_reference_scan.py || status=1
            python3 project/tools/release/implementation_maturity_gate.py || status=1
            python3 -m unittest discover -s project/tests/repository_policy -p 'test_*.py' || status=1
            exit "$status"
          } 2>&1 | tee build/ci-logs/macos-static/static-policy.log
      - name: Stage macOS static-policy proof
        if: always()
        run: |
          python3 project/tools/release/stage_textual_failure_proof.py \
            --source build/ci-logs/macos-static \
            --output-root build/failure-proofs/macos-static
      - name: Upload macOS static-policy proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scratchbird-macos-static-policy-proof
          path: build/failure-proofs/macos-static
          if-no-files-found: error
          retention-days: 14

  build:
    name: macOS configure and compile (${{ matrix.arch }})
    if: ${{ github.event_name != 'pull_request' || vars.SB_MACOS_CI_ENABLED == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            cmake_arch: x86_64
          - arch: arm64
            runner: macos-15
            cmake_arch: arm64

    steps:
      - name: Architecture filter
        id: arch_filter
        run: |
          requested="${{ inputs.architecture || 'all' }}"
          if [ "$requested" = "all" ] || [ "$requested" = "${{ matrix.arch }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.arch }} because requested architecture is $requested."
          fi

      - name: Checkout
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        uses: actions/checkout@v4
      - name: Install macOS release dependencies
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        run: bash project/tools/ci/install_macos_release_dependencies.sh
      - name: Expose Homebrew dependency roots
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        run: bash project/tools/ci/export_macos_release_environment.sh
      - name: Verify external Homebrew LLVM runtime
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        run: |
          test -f "$SB_LLVM_RUNTIME_LIBRARY"
          python3 -c 'import ctypes, sys; ctypes.CDLL(sys.argv[1])' "$SB_LLVM_RUNTIME_LIBRARY"
      - name: Configure
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        working-directory: project
        run: |
          mkdir -p ../build/ci-logs/macos-${{ matrix.arch }}-build
          set -o pipefail
          cmake --preset public-release-macos \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DICU_ROOT="$ICU_ROOT" \
            -DODBC_INCLUDE_DIR="$ODBC_ROOT/include" \
            -DODBC_LIBRARY="$ODBC_ROOT/lib/libodbc.dylib" \
            -DSB_LLVM_LIBRARY="$SB_LLVM_LIBRARY" \
            -DSB_LLVM_RUNTIME_LIBRARY="$SB_LLVM_RUNTIME_LIBRARY" \
            -DSB_LLVM_MIN_MAJOR="$SB_LLVM_MIN_MAJOR" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            2>&1 | tee ../build/ci-logs/macos-${{ matrix.arch }}-build/configure.log
      - name: Build
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        working-directory: project
        run: |
          set -o pipefail
          cmake --build --preset public-release-macos \
            2>&1 | tee ../build/ci-logs/macos-${{ matrix.arch }}-build/build.log
      - name: Stage bounded configured macOS build handoff
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        run: |
          python3 project/tools/ci/stage_ci_build_handoff.py \
            --test-dir build/public-release-macos \
            --platform macos \
            --include-label "$SB_CI_RELEASE_LABELS" \
            --exclude-label "$SB_MACOS_CTEST_PLATFORM_EXCLUDE" \
            --output-root "build/ci-handoff/macos-${{ matrix.arch }}"
      - name: Archive configured macOS build handoff
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        run: |
          mkdir -p build/ci-artifacts
          set -o pipefail
          tar -cf - -C "build/ci-handoff/macos-${{ matrix.arch }}" . | \
            zstd -T0 -3 --long=27 \
              -o "build/ci-artifacts/public-release-macos-${{ matrix.arch }}.tar.zst"
      - name: Upload configured macOS build
        uses: actions/upload-artifact@v4
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        with:
          name: scratchbird-macos-${{ matrix.arch }}-configured-build
          path: build/ci-artifacts/public-release-macos-${{ matrix.arch }}.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Stage macOS compile proof
        if: ${{ always() && steps.arch_filter.outputs.run == 'true' }}
        run: |
          python3 project/tools/release/stage_textual_failure_proof.py \
            --source build/ci-logs/macos-${{ matrix.arch }}-build \
            --source build/public-release-macos/Testing \
            --output-root build/failure-proofs/macos-${{ matrix.arch }}-build
      - name: Upload macOS compile proof
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.arch_filter.outputs.run == 'true' }}
        with:
          name: scratchbird-macos-${{ matrix.arch }}-compile-proof
          path: build/failure-proofs/macos-${{ matrix.arch }}-build
          if-no-files-found: error
          retention-days: 14

  unit-runtime-tests:
    name: macOS unit and runtime tests (${{ matrix.arch }})
    needs: build
    if: ${{ always() && (github.event_name != 'pull_request' || vars.SB_MACOS_CI_ENABLED == 'true') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - name: Architecture filter
        id: arch_filter
        run: |
          requested="${{ inputs.architecture || 'all' }}"
          if [ "$requested" = "all" ] || [ "$requested" = "${{ matrix.arch }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        uses: actions/checkout@v4
      - name: Download configured macOS build
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: scratchbird-macos-${{ matrix.arch }}-configured-build
          path: build/ci-artifacts
      - name: Install macOS release dependencies
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        run: bash project/tools/ci/install_macos_release_dependencies.sh
      - name: Expose Homebrew dependency roots
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        run: bash project/tools/ci/export_macos_release_environment.sh
      - name: Restore configured macOS build
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        run: |
          set -o pipefail
          zstd -dc "build/ci-artifacts/public-release-macos-${{ matrix.arch }}.tar.zst" | tar -xf -
      - name: Run macOS unit and runtime partition
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        working-directory: project
        run: |
          python3 tools/ci/run_ctest_chunks.py \
            --preset public-release-macos --chunk-count 8 --timeout 900 \
            --include-label "$SB_CI_RELEASE_LABELS" \
            --exclude-label "$SB_CI_PROCESS_LABELS" \
            --exclude-label "$SB_MACOS_CTEST_PLATFORM_EXCLUDE" \
            --output-root ../build/ctest-chunks/macos-${{ matrix.arch }}-unit-runtime
      - name: Stage macOS unit-runtime proof
        if: ${{ always() && steps.arch_filter.outputs.run == 'true' }}
        run: |
          python3 project/tools/release/stage_textual_failure_proof.py \
            --source build/ctest-chunks/macos-${{ matrix.arch }}-unit-runtime \
            --source build/public-release-macos/Testing \
            --output-root build/failure-proofs/macos-${{ matrix.arch }}-unit-runtime
      - name: Upload macOS unit-runtime proof
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.arch_filter.outputs.run == 'true' }}
        with:
          name: scratchbird-macos-${{ matrix.arch }}-unit-runtime-proof
          path: build/failure-proofs/macos-${{ matrix.arch }}-unit-runtime
          if-no-files-found: error
          retention-days: 14

  process-integration-tests:
    name: macOS process and integration tests (${{ matrix.arch }})
    needs: build
    if: ${{ always() && (github.event_name != 'pull_request' || vars.SB_MACOS_CI_ENABLED == 'true') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - name: Architecture filter
        id: arch_filter
        run: |
          requested="${{ inputs.architecture || 'all' }}"
          if [ "$requested" = "all" ] || [ "$requested" = "${{ matrix.arch }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        uses: actions/checkout@v4
      - name: Download configured macOS build
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: scratchbird-macos-${{ matrix.arch }}-configured-build
          path: build/ci-artifacts
      - name: Install macOS release dependencies
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        run: bash project/tools/ci/install_macos_release_dependencies.sh
      - name: Expose Homebrew dependency roots
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        run: bash project/tools/ci/export_macos_release_environment.sh
      - name: Restore configured macOS build
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        run: |
          set -o pipefail
          zstd -dc "build/ci-artifacts/public-release-macos-${{ matrix.arch }}.tar.zst" | tar -xf -
      - name: Run macOS process and integration partition
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        working-directory: project
        run: |
          python3 tools/ci/run_ctest_chunks.py \
            --preset public-release-macos --chunk-count 4 --timeout 900 \
            --include-label "$SB_CI_RELEASE_LABELS" \
            --require-label "$SB_CI_PROCESS_LABELS" \
            --exclude-label "$SB_MACOS_CTEST_PLATFORM_EXCLUDE" \
            --output-root ../build/ctest-chunks/macos-${{ matrix.arch }}-process-integration
      - name: Stage macOS process-integration proof
        if: ${{ always() && steps.arch_filter.outputs.run == 'true' }}
        run: |
          python3 project/tools/release/stage_textual_failure_proof.py \
            --source build/ctest-chunks/macos-${{ matrix.arch }}-process-integration \
            --source build/public-release-macos/Testing \
            --output-root build/failure-proofs/macos-${{ matrix.arch }}-process-integration
      - name: Upload macOS process-integration proof
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.arch_filter.outputs.run == 'true' }}
        with:
          name: scratchbird-macos-${{ matrix.arch }}-process-integration-proof
          path: build/failure-proofs/macos-${{ matrix.arch }}-process-integration
          if-no-files-found: error
          retention-days: 14

  packaging:
    name: macOS package and installer verification (${{ matrix.arch }})
    needs: build
    if: ${{ always() && (github.event_name != 'pull_request' || vars.SB_MACOS_CI_ENABLED == 'true') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
      SB_INCLUDE_SYSTEM_PACKAGES: ${{ inputs.include_system_packages && 'true' || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            cmake_arch: x86_64
          - arch: arm64
            runner: macos-15
            cmake_arch: arm64
    steps:
      - name: Architecture filter
        id: arch_filter
        run: |
          requested="${{ inputs.architecture || 'all' }}"
          if [ "$requested" = "all" ] || [ "$requested" = "${{ matrix.arch }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.arch }} because requested architecture is $requested."
          fi
      - name: Checkout
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        uses: actions/checkout@v4
      - name: Download configured macOS build
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: scratchbird-macos-${{ matrix.arch }}-configured-build
          path: build/ci-artifacts
      - name: Install macOS release dependencies
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        run: bash project/tools/ci/install_macos_release_dependencies.sh
      - name: Expose Homebrew dependency roots
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        run: bash project/tools/ci/export_macos_release_environment.sh
      - name: Restore configured macOS build
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        run: |
          set -o pipefail
          zstd -dc "build/ci-artifacts/public-release-macos-${{ matrix.arch }}.tar.zst" | tar -xf -
      - name: Verify external Homebrew LLVM runtime
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        run: |
          test -f "$SB_LLVM_RUNTIME_LIBRARY"
          python3 -c 'import ctypes, sys; ctypes.CDLL(sys.argv[1])' "$SB_LLVM_RUNTIME_LIBRARY"

      - name: Verify staged public bundle
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        run: python3 project/tools/release/verify_public_release_bundle.py build/public-release-macos/output/macos

      - name: Stage and verify native-only SB bundle
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        run: |
          python3 project/tools/release/stage_native_release_bundle.py \
            --source-root build/public-release-macos/output/macos \
            --output-root build/native-release-macos/output/macos \
            --platform macos
          python3 project/tools/release/verify_public_release_bundle.py build/native-release-macos/output/macos
          python3 project/tools/release/verify_native_release_bundle.py \
            build/native-release-macos/output/macos --platform macos
          credential_probe_source="build/public-release-macos/output/macos/bin/sb_bootstrap_os_authority_tests"
          test -x "$credential_probe_source"
          mkdir -p "build/macos-credential-probe/${{ matrix.arch }}"
          cp "$credential_probe_source" \
            "build/macos-credential-probe/${{ matrix.arch }}/sb_bootstrap_os_authority_tests"
          chmod 0755 "build/macos-credential-probe/${{ matrix.arch }}/sb_bootstrap_os_authority_tests"
          cmake -E remove_directory build/public-release-macos/output/macos

      - name: Build macOS installers
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        env:
          SB_MACOS_SIGNING_MODE: qa-unsigned
        run: |
          installer_args=(
            --platform macos
            --artifact-root build/native-release-macos/output/macos
            --output-root build/installers/macos-${{ matrix.arch }}
            --version "0.0.0-ci-${{ github.run_id }}-${{ matrix.arch }}"
            --build-id "${{ github.run_id }}-${{ matrix.arch }}"
            --require-native-only
          )
          if [ "$SB_INCLUDE_SYSTEM_PACKAGES" = "true" ]; then
            installer_args+=(--include-system-packages)
          fi
          python3 project/tools/installers/build_installers.py "${installer_args[@]}"

      - name: Verify macOS installer artifacts
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        run: >-
          python3 project/tools/installers/verify_installer_artifacts.py
          --platform macos
          --architecture "${{ matrix.arch }}"
          --artifact-root build/installers/macos-${{ matrix.arch }}

      - name: Smoke macOS tarball
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        run: |
          archive="$(ls build/installers/macos-${{ matrix.arch }}/scratchbird-macos-*.tar.gz | head -n 1)"
          project/tools/installers/smoke_install_macos.sh "$archive" build/install-smoke/macos-${{ matrix.arch }}-tar

      - name: Smoke macOS system package install and cleanup
        if: ${{ steps.arch_filter.outputs.run == 'true' && inputs.include_system_packages == true }}
        run: |
          set -euo pipefail
          package="$(ls build/installers/macos-${{ matrix.arch }}/scratchbird-macos-*.pkg | head -n 1)"
          proof_root="build/install-smoke/macos-${{ matrix.arch }}-pkg-system"
          for existing_path in \
            /opt/ScratchBird \
            "/Library/Application Support/ScratchBird" \
            /Library/LaunchDaemons/com.scratchbird.sbsrv.plist \
            /Library/LaunchDaemons/com.scratchbird.sbmgr.plist \
            /Library/LaunchDaemons/com.scratchbird.credential-probe.plist \
            /var/lib/scratchbird \
            /var/log/scratchbird \
            /var/run/scratchbird; do
            if [ -e "$existing_path" ]; then
              echo "Refusing to overwrite pre-existing hosted-runner state: $existing_path" >&2
              exit 1
            fi
          done
          if sudo dscl . -read /Users/scratchbird >/dev/null 2>&1 || \
             sudo dscl . -read /Groups/scratchbird >/dev/null 2>&1 || \
             pkgutil --pkg-info com.scratchbird.cde >/dev/null 2>&1; then
            echo "Refusing to overwrite a pre-existing ScratchBird identity or package receipt." >&2
            exit 1
          fi
          cleanup_system_install() {
            local cleanup_status=0
            set +e
            mkdir -p "$proof_root"
            if [ -x /opt/ScratchBird/libexec/scratchbird-macos-system-install ]; then
              if sudo /opt/ScratchBird/libexec/scratchbird-macos-system-install \
                pre-remove --package-format pkg --package-version "0.0.0-ci-${{ github.run_id }}-${{ matrix.arch }}" \
                > "$proof_root/pre-remove.txt" 2>&1; then
                sudo test -d /var/lib/scratchbird/install/config-preserve || cleanup_status=1
              else
                cleanup_status=1
              fi
            else
              cleanup_status=1
            fi
            for label in com.scratchbird.sbsrv com.scratchbird.sbmgr com.scratchbird.credential-probe; do
              if launchctl print "system/$label" >/dev/null 2>&1; then
                sudo launchctl bootout "system/$label" || cleanup_status=1
              fi
            done
            sudo rm -f \
              /Library/LaunchDaemons/com.scratchbird.sbsrv.plist \
              /Library/LaunchDaemons/com.scratchbird.sbmgr.plist \
              /Library/LaunchDaemons/com.scratchbird.credential-probe.plist || cleanup_status=1
            sudo rm -rf \
              /opt/ScratchBird \
              "/Library/Application Support/ScratchBird" \
              /var/lib/scratchbird \
              /var/log/scratchbird \
              /var/run/scratchbird || cleanup_status=1
            sudo pkgutil --forget com.scratchbird.cde \
              > "$proof_root/pkg-forget.txt" 2>&1 || true
            if sudo dscl . -read /Users/scratchbird >/dev/null 2>&1; then
              sudo dscl . -delete /Users/scratchbird || cleanup_status=1
            fi
            if sudo dscl . -read /Groups/scratchbird >/dev/null 2>&1; then
              sudo dscl . -delete /Groups/scratchbird || cleanup_status=1
            fi
            for removed_path in \
              /opt/ScratchBird \
              "/Library/Application Support/ScratchBird" \
              /Library/LaunchDaemons/com.scratchbird.sbsrv.plist \
              /Library/LaunchDaemons/com.scratchbird.sbmgr.plist \
              /Library/LaunchDaemons/com.scratchbird.credential-probe.plist \
              /var/lib/scratchbird \
              /var/log/scratchbird \
              /var/run/scratchbird; do
              if [ -e "$removed_path" ]; then
                echo "System-install cleanup left $removed_path" >&2
                cleanup_status=1
              fi
            done
            sudo dscl . -read /Users/scratchbird >/dev/null 2>&1 && cleanup_status=1
            sudo dscl . -read /Groups/scratchbird >/dev/null 2>&1 && cleanup_status=1
            launchctl print system/com.scratchbird.sbsrv >/dev/null 2>&1 && cleanup_status=1
            launchctl print system/com.scratchbird.sbmgr >/dev/null 2>&1 && cleanup_status=1
            launchctl print system/com.scratchbird.credential-probe >/dev/null 2>&1 && cleanup_status=1
            pkgutil --pkg-info com.scratchbird.cde >/dev/null 2>&1 && cleanup_status=1
            if [ "$cleanup_status" -eq 0 ]; then
              {
                echo "system_uninstall_cleanup=passed"
                echo "pre_remove_config_preservation=passed"
                echo "runtime_removed=passed"
                echo "launchd_plists_removed=passed"
                echo "service_identity_removed=passed"
                echo "package_receipt_forgotten=passed"
              } > "$proof_root/macos-system-uninstall-cleanup.txt"
              echo "host_runner_uninstall_cleanup=passed" >> "$proof_root/macos-lifecycle-smoke.txt"
            fi
            set -e
            return "$cleanup_status"
          }
          cleanup_on_exit() {
            local primary_status=$?
            local cleanup_status=0
            trap - EXIT
            cleanup_system_install || cleanup_status=$?
            if [ "$primary_status" -ne 0 ]; then
              exit "$primary_status"
            fi
            exit "$cleanup_status"
          }
          trap cleanup_on_exit EXIT

          project/tools/installers/smoke_install_macos.sh "$package" "$proof_root"
          set +e
          sudo installer -verboseR -pkg "$package" -target / \
            2>&1 | tee "$proof_root/system-installer.txt"
          installer_status=${PIPESTATUS[0]}
          set -e
          if [ "$installer_status" -ne 0 ]; then
            sudo tail -n 400 /var/log/install.log \
              > "$proof_root/system-installer-install.log" 2>&1 || true
            sudo log show --style syslog --last 5m \
              --predicate 'eventMessage CONTAINS[c] "scratchbird"' \
              > "$proof_root/system-installer-unified.log" 2>&1 || true
            sudo log show --style syslog --last 5m \
              --predicate 'eventMessage CONTAINS[c] "scratchbird-installer"' \
              > "$proof_root/system-installer-stage.log" 2>&1 || true
            exit "$installer_status"
          fi
          sudo "$(command -v python3)" project/tools/release/verify_native_installed_payload.py \
            /opt/ScratchBird \
            --config-root "/Library/Application Support/ScratchBird" \
            --expected-architecture "${{ matrix.arch }}"
          python3 - /Library/LaunchDaemons <<'PY'
          import pathlib
          import plistlib
          import sys

          root = pathlib.Path(sys.argv[1])
          expected_services = {
              "com.scratchbird.sbsrv": ("sbsrv", "SBsrv"),
              "com.scratchbird.sbmgr": ("sbmgr", "SBmgr"),
          }
          for label, (selector, binary) in expected_services.items():
              data = plistlib.loads((root / f"{label}.plist").read_bytes())
              if data.get("UserName") != "root" or data.get("GroupName") != "wheel":
                  raise SystemExit(f"macos_system_launchd_bootstrap_identity_mismatch:{label}")
              if data.get("InitGroups") is not False:
                  raise SystemExit(f"macos_system_launchd_initgroups_mismatch:{label}")
              if data.get("ProgramArguments") != ["/opt/ScratchBird/bin/SBlaunch", selector]:
                  raise SystemExit(f"macos_system_launchd_launcher_mismatch:{label}")
              if data.get("WorkingDirectory") != "/var/lib/scratchbird":
                  raise SystemExit(f"macos_system_launchd_working_directory_mismatch:{label}")
              if data.get("StandardOutPath") != f"/var/log/scratchbird/launchd/{binary}.out.log":
                  raise SystemExit(f"macos_system_launchd_stdout_mismatch:{label}")
              if data.get("StandardErrorPath") != f"/var/log/scratchbird/launchd/{binary}.err.log":
                  raise SystemExit(f"macos_system_launchd_stderr_mismatch:{label}")
              if data.get("Disabled") is not True:
                  raise SystemExit(f"macos_system_launchd_not_disabled:{label}")
              if data.get("RunAtLoad") is not False or data.get("KeepAlive") is not False:
                  raise SystemExit(f"macos_system_launchd_activity_mismatch:{label}")
          PY
          for label in com.scratchbird.sbsrv com.scratchbird.sbmgr; do
            if launchctl print "system/$label" >/dev/null 2>&1; then
              echo "System package unexpectedly loaded $label." >&2
              exit 1
            fi
          done
          credential_probe="$GITHUB_WORKSPACE/build/macos-credential-probe/${{ matrix.arch }}/sb_bootstrap_os_authority_tests"
          test -x "$credential_probe"
          sudo "$credential_probe" \
            --verify-installed-service-identity \
            "/Library/Application Support/ScratchBird/SBbootstrap.profile" \
            > "$proof_root/installed-service-identity.txt" \
            2> "$proof_root/installed-service-identity.stderr.txt"
          test ! -s "$proof_root/installed-service-identity.stderr.txt"
          grep -Fx "installed_service_identity_assumption=passed" \
            "$proof_root/installed-service-identity.txt"
          grep -Fx "effective_user=scratchbird" \
            "$proof_root/installed-service-identity.txt"
          grep -Fx "effective_group=scratchbird" \
            "$proof_root/installed-service-identity.txt"
          grep -Fx "bootstrap_authority_regain=refused" \
            "$proof_root/installed-service-identity.txt"
          project/tools/installers/smoke_macos_launchd_credential.sh \
            "$credential_probe" \
            "/Library/Application Support/ScratchBird/SBbootstrap.profile" \
            "$proof_root/launchd-credential"
          pkgutil --pkg-info com.scratchbird.cde > "$proof_root/pkg-receipt.txt"
          sudo cat /var/lib/scratchbird/install/MACOS_SYSTEM_INSTALL_STATE.json \
            > "$proof_root/MACOS_SYSTEM_INSTALL_STATE.json"
          python3 - "$proof_root/MACOS_SYSTEM_INSTALL_STATE.json" <<'PY'
          import json
          import sys

          state = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {
              "service_user": "scratchbird",
              "service_group": "scratchbird",
              "service_administrator_group_membership": False,
              "service_enablement_default": "disabled",
              "service_activity_default": "not_started",
              "launchd_load_performed": False,
              "native_default_port": 3092,
              "database_files_created": False,
              "security_sidecars_created": False,
          }
          for key, value in expected.items():
              if state.get(key) != value:
                  raise SystemExit(f"macos_system_state_mismatch:{key}")
          PY
          service_shell="$(sudo dscl . -read /Users/scratchbird UserShell | awk 'NR == 1 { print $2 }')"
          service_home="$(sudo dscl . -read /Users/scratchbird NFSHomeDirectory | awk 'NR == 1 { print $2 }')"
          service_hidden="$(sudo dscl . -read /Users/scratchbird IsHidden | awk 'NR == 1 { print $2 }')"
          service_password="$(sudo dscl . -read /Users/scratchbird Password | awk 'NR == 1 { print $2 }')"
          host_user="$(id -un)"
          if sudo env LC_ALL=C dseditgroup -n . -o checkmember -m "$host_user" scratchbird \
            > "$proof_root/host-user-group-membership.txt" \
            2> "$proof_root/host-user-group-membership.stderr.txt"; then
            host_user_membership_status=0
          else
            host_user_membership_status=$?
          fi
          printf '%s\n' "$host_user_membership_status" \
            > "$proof_root/host-user-group-membership-status.txt"
          if [ "$host_user_membership_status" -ne 67 ]; then
            echo "Unexpected hosted-runner service-group membership status: $host_user_membership_status" >&2
            cat "$proof_root/host-user-group-membership.txt" >&2 || true
            cat "$proof_root/host-user-group-membership.stderr.txt" >&2 || true
            exit 1
          fi
          if grep -Eq '^yes([[:space:]]|$)' "$proof_root/host-user-group-membership.txt"; then
            echo "System package granted the hosted runner user service-group membership." >&2
            exit 1
          fi
          if ! grep -Fx "no $host_user is NOT a member of scratchbird" \
            "$proof_root/host-user-group-membership.txt"; then
            echo "Hosted-runner service-group non-membership response was malformed." >&2
            cat "$proof_root/host-user-group-membership.txt" >&2 || true
            cat "$proof_root/host-user-group-membership.stderr.txt" >&2 || true
            exit 1
          fi
          test "$service_shell" = /usr/bin/false
          test "$service_home" = /var/lib/scratchbird
          test "$service_hidden" = 1
          [[ "$service_password" == \** ]]
          {
            echo "system_install=passed"
            echo "service_user=scratchbird"
            echo "service_shell=$service_shell"
            echo "service_home=$service_home"
            echo "service_hidden=$service_hidden"
            echo "host_user_group_admission=not_performed"
            echo "launchd_default_state=disabled_not_loaded"
          } > "$proof_root/macos-system-identity.txt"

      - name: Stage macOS packaging proof
        if: ${{ always() && steps.arch_filter.outputs.run == 'true' }}
        run: |
          log_input="build/macos-log-input/${{ matrix.arch }}"
          mkdir -p "$log_input"
          log show --last 5m --style compact > "$log_input/system-log-last-5m.txt" || true
          python3 project/tools/release/stage_textual_failure_proof.py \
            --source build/install-smoke \
            --source "$log_input" \
            --output-root build/failure-proofs/macos-${{ matrix.arch }}-packaging

      - name: Upload macOS packaging proof
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.arch_filter.outputs.run == 'true' }}
        with:
          name: scratchbird-macos-${{ matrix.arch }}-packaging-proof
          path: build/failure-proofs/macos-${{ matrix.arch }}-packaging
          if-no-files-found: warn
          retention-days: 14

      - name: Materialize exact public macOS portable artifact
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        run: |
          python3 project/tools/installers/verify_installer_artifacts.py \
            --platform macos \
            --architecture "${{ matrix.arch }}" \
            --artifact-root build/installers/macos-${{ matrix.arch }} \
            --materialize-public-root build/public-installers/macos-${{ matrix.arch }}

      - name: Stage macOS textual install-smoke proof
        if: ${{ always() && steps.arch_filter.outputs.run == 'true' }}
        run: |
          python3 project/tools/release/stage_textual_failure_proof.py \
            --source build/install-smoke \
            --output-root build/failure-proofs/macos-${{ matrix.arch }}-installers

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        if: ${{ success() && steps.arch_filter.outputs.run == 'true' }}
        with:
          name: scratchbird-macos-${{ matrix.arch }}-installers
          path: build/public-installers/macos-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS install smoke proof
        uses: actions/upload-artifact@v4
        if: ${{ always() && steps.arch_filter.outputs.run == 'true' }}
        with:
          name: scratchbird-macos-${{ matrix.arch }}-install-smoke
          path: build/failure-proofs/macos-${{ matrix.arch }}-installers
          if-no-files-found: warn
          retention-days: 14

  macos-universal-artifact:
    name: macOS universal QA artifact
    needs: packaging
    if: ${{ always() && needs.packaging.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.architecture == 'all') }}
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Homebrew LLVM runtime for universal smoke
        run: |
          brew install llvm
          llvm_runtime="$(brew --prefix llvm)/lib/libLLVM.dylib"
          test -f "$llvm_runtime"
          python3 -c 'import ctypes, sys; ctypes.CDLL(sys.argv[1])' "$llvm_runtime"

      - name: Download macOS x86_64 installer artifact
        uses: actions/download-artifact@v4
        with:
          name: scratchbird-macos-x86_64-installers
          path: build/universal-input/scratchbird-macos-x86_64-installers

      - name: Download macOS arm64 installer artifact
        uses: actions/download-artifact@v4
        with:
          name: scratchbird-macos-arm64-installers
          path: build/universal-input/scratchbird-macos-arm64-installers

      - name: Assemble universal QA tarball
        run: |
          x86_tars=()
          while IFS= read -r candidate; do
            x86_tars+=("$candidate")
          done < <(
            find build/universal-input \
              -type f \
              -path '*/scratchbird-macos-x86_64-installers/scratchbird-macos-*.tar.gz' \
              -print | sort
          )
          arm_tars=()
          while IFS= read -r candidate; do
            arm_tars+=("$candidate")
          done < <(
            find build/universal-input \
              -type f \
              -path '*/scratchbird-macos-arm64-installers/scratchbird-macos-*.tar.gz' \
              -print | sort
          )
          test "${#x86_tars[@]}" -eq 1
          test "${#arm_tars[@]}" -eq 1
          x86_tar="${x86_tars[0]}"
          arm_tar="${arm_tars[0]}"
          python3 project/tools/installers/make_macos_universal.py \
            --x86-tar "$x86_tar" \
            --arm-tar "$arm_tar" \
            --output-root build/public-installers/macos-universal \
            --version "0.0.0-ci-${{ github.run_id }}-universal" \
            --build-id "${{ github.run_id }}-universal"

      - name: Smoke universal tarball
        run: |
          archive="$(ls build/public-installers/macos-universal/scratchbird-macos-universal-*.tar.gz | head -n 1)"
          project/tools/installers/smoke_install_macos.sh "$archive" build/install-smoke/macos-universal-tar

      - name: Stage universal macOS packaging proof
        if: always()
        run: |
          python3 project/tools/release/stage_textual_failure_proof.py \
            --source build/install-smoke/macos-universal-tar \
            --output-root build/failure-proofs/macos-universal-packaging

      - name: Upload universal macOS packaging proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scratchbird-macos-universal-packaging-proof
          path: build/failure-proofs/macos-universal-packaging
          if-no-files-found: error
          retention-days: 14

      - name: Upload universal macOS QA artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: scratchbird-macos-universal-installers
          path: build/public-installers/macos-universal
          if-no-files-found: error
          retention-days: 14

  public-release-macos:
    name: Public release macOS build and CTest (${{ matrix.arch }})
    needs:
      - static-policy
      - build
      - unit-runtime-tests
      - process-integration-tests
      - packaging
      - macos-universal-artifact
    if: ${{ always() && (github.event_name != 'pull_request' || vars.SB_MACOS_CI_ENABLED == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - arm64
    steps:
      - name: Architecture filter
        id: arch_filter
        run: |
          requested="${{ inputs.architecture || 'all' }}"
          if [ "$requested" = all ] || [ "$requested" = "${{ matrix.arch }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fail-closed macOS release decision
        if: ${{ steps.arch_filter.outputs.run == 'true' }}
        env:
          STATIC_POLICY_RESULT: ${{ needs.static-policy.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          UNIT_RUNTIME_RESULT: ${{ needs.unit-runtime-tests.result }}
          PROCESS_INTEGRATION_RESULT: ${{ needs.process-integration-tests.result }}
          PACKAGING_RESULT: ${{ needs.packaging.result }}
          UNIVERSAL_RESULT: ${{ needs.macos-universal-artifact.result }}
          UNIVERSAL_REQUIRED: ${{ github.event_name != 'workflow_dispatch' || inputs.architecture == 'all' }}
        run: |
          status=0
          for result in "$STATIC_POLICY_RESULT" "$BUILD_RESULT" "$UNIT_RUNTIME_RESULT" "$PROCESS_INTEGRATION_RESULT" "$PACKAGING_RESULT"; do
            if [ "$result" != success ]; then status=1; fi
          done
          if [ "$UNIVERSAL_REQUIRED" = true ]; then
            if [ "$UNIVERSAL_RESULT" != success ]; then status=1; fi
          elif [ "$UNIVERSAL_RESULT" != success ] && [ "$UNIVERSAL_RESULT" != skipped ]; then
            status=1
          fi
          printf 'static-policy=%s\nbuild=%s\nunit-runtime-tests=%s\nprocess-integration-tests=%s\npackaging=%s\nmacos-universal-artifact=%s\n' \
            "$STATIC_POLICY_RESULT" "$BUILD_RESULT" "$UNIT_RUNTIME_RESULT" "$PROCESS_INTEGRATION_RESULT" "$PACKAGING_RESULT" "$UNIVERSAL_RESULT"
          exit "$status"
