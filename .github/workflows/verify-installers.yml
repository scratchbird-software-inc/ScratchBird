name: ScratchBird Installer Verification

on:
  workflow_call:
    inputs:
      platform:
        required: false
        type: string
        default: all
      version:
        required: false
        type: string
        default: 0.0.0-nightly
      require-msi:
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to verify
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - macos
      version:
        description: Version suffix for generated installers
        required: true
        default: 0.0.0-nightly
      require-msi:
        description: Retained for caller compatibility; Windows MSI proof is mandatory
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  SB_INSTALLER_VERSION: ${{ inputs.version || '0.0.0-nightly' }}
  SB_REQUIRE_MSI: ${{ inputs['require-msi'] }}

concurrency:
  group: installer-verify-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true

jobs:
  linux-installers:
    name: Linux installers
    if: ${{ inputs.platform == 'all' || inputs.platform == 'linux' || inputs.platform == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            python3 \
            clang-tidy-18 \
            cppcheck \
            g++-mingw-w64-x86-64 \
            wget \
            gnupg \
            lsb-release \
            rpm \
            libssl-dev \
            libboost-dev \
            libicu-dev \
            libxml2-dev \
            zlib1g-dev \
            liblz4-dev \
            libzstd-dev \
            libgeos-dev \
            libproj-dev \
            libgtest-dev \
            unixodbc-dev
          wget -O /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh 23
          sudo apt-get install -y libllvm23 llvm-23-dev

      - name: Static release gates
        run: |
          python3 project/tools/release/public_packaging_history_gate.py
          python3 project/tools/release/github_actions_static_gate.py

      - name: Configure
        working-directory: project
        run: cmake --preset public-release-linux

      - name: Record LLVM version and configured runtime resolution
        working-directory: project
        run: |
          set -euo pipefail
          llvm_config="$(command -v llvm-config-23)"
          llvm_version="$("$llvm_config" --version)"
          llvm_major="${llvm_version%%.*}"
          test "$llvm_major" -ge 23
          llvm_cmake_dir="$("$llvm_config" --cmakedir)"
          test -d "$llvm_cmake_dir"

          cache="../build/public-release-linux/CMakeCache.txt"
          test -f "$cache"
          cache_value() {
            local key="$1"
            local line
            line="$(grep -E "^${key}:[^=]+=" "$cache" | tail -n 1 || true)"
            if [ -z "$line" ]; then
              echo "Missing configured LLVM evidence key: $key" >&2
              return 1
            fi
            printf '%s\n' "${line#*=}"
          }
          configured_llvm_dir="$(cache_value LLVM_DIR)"
          configured_library="$(cache_value SB_LLVM_LIBRARY)"
          configured_runtime="$(cache_value SB_LLVM_RUNTIME_LIBRARY_RESOLVED)"
          configured_delivery="$(cache_value SB_LLVM_RUNTIME_DELIVERY)"
          configured_minimum="$(cache_value SB_LLVM_MIN_MAJOR)"
          test -d "$configured_llvm_dir"
          test -f "$configured_library"
          test "$configured_minimum" -ge 23
          test "$configured_delivery" = system-package
          [[ "$configured_runtime" =~ ^libLLVM(-[0-9]+)?[.]so([.][0-9]+)*$ ]]
          [[ "$configured_runtime" != */* ]]

          {
            echo "### Linux LLVM installer configuration"
            echo
            echo "- llvm-config: \`$llvm_config\`"
            echo "- LLVM version: \`$llvm_version\`"
            echo "- LLVM CMake package: \`$configured_llvm_dir\`"
            echo "- Configured build library: \`$configured_library\`"
            echo "- Installed runtime reference: \`$configured_runtime\`"
            echo "- Runtime delivery: \`$configured_delivery\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        working-directory: project
        run: cmake --build --preset public-release-linux

      - name: CTest
        working-directory: project
        run: |
          status=0
          ctest --preset public-release-linux -L public_release_correctness || status=1
          ctest --preset public-release-linux -L engine_listener_enterprise || status=1
          exit "$status"

      - name: Verify public bundle
        run: python3 project/tools/release/verify_public_release_bundle.py build/public-release-linux/output/linux

      - name: Stage and verify native-only SB bundle
        run: |
          python3 project/tools/release/stage_native_release_bundle.py \
            --source-root build/public-release-linux/output/linux \
            --output-root build/native-release-linux/output/linux \
            --platform linux
          python3 project/tools/release/verify_public_release_bundle.py build/native-release-linux/output/linux
          python3 project/tools/release/verify_native_release_bundle.py \
            build/native-release-linux/output/linux --platform linux
          mkdir -p build/bootstrap-probes
          cp build/public-release-linux/output/linux/bin/sb_bootstrap_os_authority_tests \
            build/bootstrap-probes/sb_bootstrap_os_authority_tests-linux
          chmod 0755 build/bootstrap-probes/sb_bootstrap_os_authority_tests-linux
          cmake -E remove_directory build/public-release-linux

      - name: Build installers
        run: |
          python3 project/tools/installers/build_installers.py \
            --platform linux \
            --artifact-root build/native-release-linux/output/linux \
            --output-root build/installers/linux \
            --version "$SB_INSTALLER_VERSION" \
            --build-id "${{ github.run_id }}" \
            --require-native-only \
            --require-rpm

      - name: Verify installer artifacts
        run: |
          python3 project/tools/installers/verify_installer_artifacts.py --platform linux --artifact-root build/installers/linux
          cmake -E remove_directory build/native-release-linux/output/linux

      - name: Smoke tarball install
        run: |
          archive="$(ls build/installers/linux/scratchbird-linux-*.tar.gz | head -n 1)"
          project/tools/installers/smoke_install_linux.sh "$archive" build/install-smoke/linux

      - name: Smoke Linux system-package lifecycle
        run: |
          python3 project/tools/installers/smoke_install_linux_system.py \
            --artifact-root build/installers/linux \
            --work-root build/install-smoke/linux/system-package-proof \
            --run-privileged-deb-install \
            --authority-probe \
            "$GITHUB_WORKSPACE/build/bootstrap-probes/sb_bootstrap_os_authority_tests-linux"

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scratchbird-linux-installers
          path: build/installers/linux
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux install smoke proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scratchbird-linux-install-smoke
          path: build/install-smoke/linux
          if-no-files-found: warn
          retention-days: 14

  windows-installers:
    name: Windows installers
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' || inputs.platform == '' }}
    runs-on: windows-2022
    timeout-minutes: 300

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-clang-tools-extra
            mingw-w64-ucrt-x86_64-cppcheck
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-icu
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-lz4
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-geos
            mingw-w64-ucrt-x86_64-proj
            mingw-w64-ucrt-x86_64-gtest

      - name: Set up WiX and utility extension
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          $toolRoot = "$env:USERPROFILE\.dotnet\tools"
          $env:PATH = "$toolRoot;$env:PATH"
          $toolRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          wix extension add -g "WixToolset.Util.wixext/4.0.6"

      - name: Verify Windows LocalAccounts lifecycle dependency
        shell: pwsh
        run: |
          $windowsPowerShell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          if (-not (Test-Path -LiteralPath $windowsPowerShell -PathType Leaf)) {
            throw "64-bit Windows PowerShell is unavailable"
          }
          $env:SB_LIFECYCLE_PARSE_PATH = (Resolve-Path `
            "project/tools/installers/windows/scratchbird-windows-system-install.ps1").Path
          $probe = @'
          $ErrorActionPreference = "Stop"
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $env:SB_LIFECYCLE_PARSE_PATH, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -ne 0) { exit 9 }
          if (-not [Environment]::Is64BitProcess) { exit 10 }
          $moduleRoot = Join-Path $PSHOME "Modules\Microsoft.PowerShell.LocalAccounts"
          if (-not (Test-Path -LiteralPath $moduleRoot -PathType Container)) { exit 11 }
          $manifestName = "Microsoft.PowerShell.LocalAccounts.psd1"
          $candidates = @()
          $directManifest = Join-Path $moduleRoot $manifestName
          if (Test-Path -LiteralPath $directManifest -PathType Leaf) {
            $candidates += $directManifest
          }
          foreach ($versionDirectory in @(Get-ChildItem -LiteralPath $moduleRoot -Directory -Force -ErrorAction Stop)) {
            if ($versionDirectory.Name -notmatch '^\d+(?:\.\d+){1,3}$') { continue }
            $candidate = Join-Path $versionDirectory.FullName $manifestName
            if (Test-Path -LiteralPath $candidate -PathType Leaf) {
              $candidates += $candidate
            }
          }
          if ($candidates.Count -ne 1) { exit 12 }
          $moduleManifest = $candidates[0]
          Import-Module -Name $moduleManifest -Force -ErrorAction Stop | Out-Null
          $commands = @(Get-Command -Name "Microsoft.PowerShell.LocalAccounts\New-LocalGroup" -CommandType Cmdlet -ErrorAction Stop)
          if ($commands.Count -ne 1) { exit 13 }
          if ($commands[0].ModuleName -cne "Microsoft.PowerShell.LocalAccounts") { exit 14 }
          if ($commands[0].Source -cne "Microsoft.PowerShell.LocalAccounts") { exit 15 }
          "windows_localaccounts_dependency=passed"
          '@
          & $windowsPowerShell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command $probe
          if ($LASTEXITCODE -ne 0) {
            throw "Windows LocalAccounts lifecycle dependency probe failed: $LASTEXITCODE"
          }

      - name: Static release gates
        run: |
          python project/tools/release/public_packaging_history_gate.py
          python project/tools/release/github_actions_static_gate.py

      - name: Configure
        working-directory: project
        run: |
          set -euo pipefail
          LLVM_CONFIG="${MINGW_PREFIX:-/ucrt64}/bin/llvm-config"
          if [ ! -x "$LLVM_CONFIG" ]; then
            LLVM_CONFIG="$(command -v llvm-config)"
          fi
          LLVM_CMAKE_DIR="$("$LLVM_CONFIG" --cmakedir)"
          LLVM_LIB_DIR="$("$LLVM_CONFIG" --libdir)"
          LLVM_MAJOR="$("$LLVM_CONFIG" --version | sed -E 's/^([0-9]+).*/\1/')"
          LLVM_REQUIRED_MAJOR=22
          test "$LLVM_MAJOR" -ge "$LLVM_REQUIRED_MAJOR"
          LLVM_BIN_DIR="${MINGW_PREFIX:-/ucrt64}/bin"
          LLVM_LIBRARY="${LLVM_BIN_DIR}/libLLVM-${LLVM_MAJOR}.dll"
          if [ ! -f "$LLVM_LIBRARY" ]; then
            LLVM_LIBRARY="$(find "$LLVM_BIN_DIR" -maxdepth 1 -name "libLLVM-${LLVM_MAJOR}*.dll" | sort | head -n 1)"
          fi
          LLVM_RUNTIME_LIBRARY="$(basename "$LLVM_LIBRARY")"
          test -d "$LLVM_CMAKE_DIR"
          test -f "$LLVM_LIBRARY"
          echo "LLVM_CONFIG=$LLVM_CONFIG"
          echo "LLVM_CMAKE_DIR=$LLVM_CMAKE_DIR"
          echo "LLVM_LIB_DIR=$LLVM_LIB_DIR"
          echo "LLVM_BIN_DIR=$LLVM_BIN_DIR"
          echo "LLVM_LIBRARY=$LLVM_LIBRARY"
          echo "LLVM_RUNTIME_LIBRARY=$LLVM_RUNTIME_LIBRARY"
          echo "LLVM_MAJOR=$LLVM_MAJOR"
          echo "LLVM_REQUIRED_MAJOR=$LLVM_REQUIRED_MAJOR"
          cmake --preset public-release-windows \
            -DLLVM_DIR="$LLVM_CMAKE_DIR" \
            -DSB_LLVM_LIBRARY="$LLVM_LIBRARY" \
            -DSB_LLVM_RUNTIME_LIBRARY="$LLVM_RUNTIME_LIBRARY" \
            -DSB_LLVM_MIN_MAJOR="$LLVM_REQUIRED_MAJOR"

      - name: Build
        working-directory: project
        run: cmake --build --preset public-release-windows

      - name: CTest
        working-directory: project
        run: |
          status=0
          ctest --preset public-release-windows -L public_release_correctness || status=1
          ctest --preset public-release-windows -L engine_listener_enterprise || status=1
          exit "$status"

      - name: Verify public bundle
        run: python project/tools/release/verify_public_release_bundle.py build/public-release-windows/output/windows

      - name: Stage and verify native-only SB bundle
        run: |
          python project/tools/release/stage_native_release_bundle.py \
            --source-root build/public-release-windows/output/windows \
            --output-root build/native-release-windows/output/windows \
            --platform windows \
            --runtime-search-root "${MINGW_PREFIX:-/ucrt64}/bin"
          python project/tools/release/verify_public_release_bundle.py build/native-release-windows/output/windows
          python project/tools/release/verify_native_release_bundle.py \
            build/native-release-windows/output/windows --platform windows
          cmake -E remove_directory build/public-release-windows

      - name: Build installers
        run: |
          export PATH="$(cygpath -u "$USERPROFILE")/.dotnet/tools:$PATH"
          command -v wix
          python project/tools/installers/build_installers.py \
            --platform windows \
            --artifact-root build/native-release-windows/output/windows \
            --output-root build/installers/windows \
            --version "$SB_INSTALLER_VERSION" \
            --build-id "${{ github.run_id }}" \
            --require-native-only \
            --require-msi

      - name: Verify installer artifacts
        run: |
          python project/tools/installers/verify_installer_artifacts.py --platform windows --artifact-root build/installers/windows --require-msi
          cmake -E remove_directory build/native-release-windows/output/windows

      - name: Smoke Windows package
        shell: pwsh
        run: |
          $package = Get-ChildItem build/installers/windows -Filter "scratchbird-windows-*.msi" | Select-Object -First 1
          if (-not $package) {
            throw "No Windows MSI package found"
          }
          project/tools/installers/smoke_install_windows.ps1 `
            -PackagePath $package.FullName `
            -WorkRoot build/install-smoke/windows

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scratchbird-windows-installers
          path: build/installers/windows
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows install smoke proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scratchbird-windows-install-smoke
          path: build/install-smoke/windows
          if-no-files-found: warn
          retention-days: 14

  macos-installers:
    name: macOS installers (${{ matrix.arch }})
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' || inputs.platform == '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            cmake_arch: x86_64
          - arch: arm64
            runner: macos-15
            cmake_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build and package dependencies
        run: |
          brew update
          brew install \
            cmake \
            ninja \
            llvm \
            openssl@3 \
            boost \
            icu4c \
            libxml2 \
            lz4 \
            zstd \
            geos \
            proj \
            googletest \
            unixodbc \
            pkg-config
          {
            echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)"
            echo "ICU_ROOT=$(brew --prefix icu4c)"
            echo "BOOST_ROOT=$(brew --prefix boost)"
            echo "LIBXML2_ROOT=$(brew --prefix libxml2)"
            echo "LLVM_DIR=$(brew --prefix llvm)/lib/cmake/llvm"
            echo "SB_LLVM_LIBRARY=$(brew --prefix llvm)/lib/libLLVM.dylib"
            echo "SB_LLVM_RUNTIME_LIBRARY=$(brew --prefix llvm)/lib/libLLVM.dylib"
            echo "ODBC_ROOT=$(brew --prefix unixodbc)"
            echo "SB_LLVM_MIN_MAJOR=22"
            echo "CMAKE_PREFIX_PATH=$(brew --prefix openssl@3);$(brew --prefix icu4c);$(brew --prefix libxml2);$(brew --prefix boost);$(brew --prefix llvm);$(brew --prefix unixodbc)"
            echo "PATH=$(brew --prefix llvm)/bin:$PATH"
            echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$PKG_CONFIG_PATH"
          } >> "$GITHUB_ENV"

      - name: Static release gates
        run: |
          python3 project/tools/release/public_packaging_history_gate.py
          python3 project/tools/release/github_actions_static_gate.py

      - name: Verify external Homebrew LLVM runtime
        run: |
          test -f "$SB_LLVM_RUNTIME_LIBRARY"
          python3 -c 'import ctypes, sys; ctypes.CDLL(sys.argv[1])' "$SB_LLVM_RUNTIME_LIBRARY"

      - name: Configure
        working-directory: project
        run: |
          cmake --preset public-release-macos \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }} \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DICU_ROOT="$ICU_ROOT" \
            -DODBC_INCLUDE_DIR="$ODBC_ROOT/include" \
            -DODBC_LIBRARY="$ODBC_ROOT/lib/libodbc.dylib" \
            -DSB_LLVM_LIBRARY="$SB_LLVM_LIBRARY" \
            -DSB_LLVM_RUNTIME_LIBRARY="$SB_LLVM_RUNTIME_LIBRARY" \
            -DSB_LLVM_MIN_MAJOR="$SB_LLVM_MIN_MAJOR" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH"

      - name: Build
        working-directory: project
        run: cmake --build --preset public-release-macos

      - name: CTest
        working-directory: project
        run: |
          status=0
          ctest --preset public-release-macos -L public_release_correctness --output-on-failure -LE "linux_proof|linux_source_proof|mingw_cross_compile|windows|freebsd|bsd" || status=1
          ctest --preset public-release-macos -L engine_listener_enterprise --output-on-failure -LE "linux_proof|linux_source_proof|mingw_cross_compile|windows|freebsd|bsd" || status=1
          exit "$status"

      - name: Verify public bundle
        run: python3 project/tools/release/verify_public_release_bundle.py build/public-release-macos/output/macos

      - name: Stage and verify native-only SB bundle
        run: |
          python3 project/tools/release/stage_native_release_bundle.py \
            --source-root build/public-release-macos/output/macos \
            --output-root build/native-release-macos/output/macos \
            --platform macos
          python3 project/tools/release/verify_public_release_bundle.py build/native-release-macos/output/macos
          python3 project/tools/release/verify_native_release_bundle.py \
            build/native-release-macos/output/macos --platform macos
          mkdir -p build/bootstrap-probes
          cp build/public-release-macos/output/macos/bin/sb_bootstrap_os_authority_tests \
            build/bootstrap-probes/sb_bootstrap_os_authority_tests-${{ matrix.arch }}
          chmod 0755 \
            build/bootstrap-probes/sb_bootstrap_os_authority_tests-${{ matrix.arch }}
          cmake -E remove_directory build/public-release-macos

      - name: Build installers
        env:
          SB_MACOS_SIGNING_MODE: qa-unsigned
        run: |
          python3 project/tools/installers/build_installers.py \
            --platform macos \
            --artifact-root build/native-release-macos/output/macos \
            --output-root build/installers/macos-${{ matrix.arch }} \
            --version "$SB_INSTALLER_VERSION" \
            --build-id "${{ github.run_id }}-${{ matrix.arch }}" \
            --require-native-only

      - name: Verify installer artifacts
        run: |
          python3 project/tools/installers/verify_installer_artifacts.py --platform macos --artifact-root build/installers/macos-${{ matrix.arch }}
          cmake -E remove_directory build/native-release-macos/output/macos

      - name: Smoke tarball install
        run: |
          archive="$(ls build/installers/macos-${{ matrix.arch }}/scratchbird-macos-*.tar.gz | head -n 1)"
          project/tools/installers/smoke_install_macos.sh "$archive" build/install-smoke/macos-${{ matrix.arch }}-tar

      - name: Smoke system package install and cleanup
        run: |
          set -euo pipefail
          package="$(ls build/installers/macos-${{ matrix.arch }}/scratchbird-macos-*.pkg | head -n 1)"
          proof_root="build/install-smoke/macos-${{ matrix.arch }}-pkg-system"
          verifier_root="/tmp/scratchbird-native-verifier-${{ github.run_id }}-${{ matrix.arch }}"
          for existing_path in \
            /opt/ScratchBird \
            "/Library/Application Support/ScratchBird" \
            /Library/LaunchDaemons/com.scratchbird.sbsrv.plist \
            /Library/LaunchDaemons/com.scratchbird.sbmgr.plist \
            /Library/LaunchDaemons/com.scratchbird.credential-probe.plist \
            /Library/LaunchDaemons/com.scratchbird.upgrade-guard-test.plist \
            /var/lib/scratchbird \
            /var/log/scratchbird \
            /var/run/scratchbird \
            "$verifier_root"; do
            if [ -e "$existing_path" ] || [ -L "$existing_path" ]; then
              echo "Refusing to overwrite pre-existing hosted-runner state: $existing_path" >&2
              exit 1
            fi
          done
          if sudo dscl . -read /Users/scratchbird >/dev/null 2>&1 || \
             sudo dscl . -read /Groups/scratchbird >/dev/null 2>&1 || \
             pkgutil --pkg-info com.scratchbird.cde >/dev/null 2>&1; then
            echo "Refusing to overwrite a pre-existing ScratchBird identity or package receipt." >&2
            exit 1
          fi
          cleanup_system_install() {
            local cleanup_status=0
            set +e
            mkdir -p "$proof_root"
            if [ -x /opt/ScratchBird/libexec/scratchbird-macos-system-install ]; then
              if sudo /opt/ScratchBird/libexec/scratchbird-macos-system-install \
                pre-remove --package-format pkg --package-version "$SB_INSTALLER_VERSION" \
                > "$proof_root/pre-remove.txt" 2>&1; then
                sudo test -d /var/lib/scratchbird/install/config-preserve || cleanup_status=1
              else
                cleanup_status=1
              fi
            else
              cleanup_status=1
            fi
            for label in com.scratchbird.sbsrv com.scratchbird.sbmgr \
              com.scratchbird.credential-probe; do
              if launchctl print "system/$label" >/dev/null 2>&1; then
                sudo launchctl bootout "system/$label" || cleanup_status=1
              fi
            done
            sudo rm -f \
              /Library/LaunchDaemons/com.scratchbird.sbsrv.plist \
              /Library/LaunchDaemons/com.scratchbird.sbmgr.plist \
              /Library/LaunchDaemons/com.scratchbird.credential-probe.plist \
              /Library/LaunchDaemons/com.scratchbird.upgrade-guard-test.plist || \
              cleanup_status=1
            sudo rm -rf \
              /opt/ScratchBird \
              "/Library/Application Support/ScratchBird" \
              /var/lib/scratchbird \
              /var/log/scratchbird \
              /var/run/scratchbird \
              "$verifier_root" || cleanup_status=1
            sudo pkgutil --forget com.scratchbird.cde \
              > "$proof_root/pkg-forget.txt" 2>&1 || true
            if sudo dscl . -read /Users/scratchbird >/dev/null 2>&1; then
              sudo dscl . -delete /Users/scratchbird || cleanup_status=1
            fi
            if sudo dscl . -read /Groups/scratchbird >/dev/null 2>&1; then
              sudo dscl . -delete /Groups/scratchbird || cleanup_status=1
            fi
            for removed_path in \
              /opt/ScratchBird \
              "/Library/Application Support/ScratchBird" \
              /Library/LaunchDaemons/com.scratchbird.sbsrv.plist \
              /Library/LaunchDaemons/com.scratchbird.sbmgr.plist \
              /Library/LaunchDaemons/com.scratchbird.credential-probe.plist \
              /Library/LaunchDaemons/com.scratchbird.upgrade-guard-test.plist \
              /var/lib/scratchbird \
              /var/log/scratchbird \
              /var/run/scratchbird \
              "$verifier_root"; do
              if [ -e "$removed_path" ] || [ -L "$removed_path" ]; then
                echo "System-install cleanup left $removed_path" >&2
                cleanup_status=1
              fi
            done
            sudo dscl . -read /Users/scratchbird >/dev/null 2>&1 && cleanup_status=1
            sudo dscl . -read /Groups/scratchbird >/dev/null 2>&1 && cleanup_status=1
            launchctl print system/com.scratchbird.sbsrv >/dev/null 2>&1 && cleanup_status=1
            launchctl print system/com.scratchbird.sbmgr >/dev/null 2>&1 && cleanup_status=1
            launchctl print system/com.scratchbird.credential-probe >/dev/null 2>&1 && cleanup_status=1
            pkgutil --pkg-info com.scratchbird.cde >/dev/null 2>&1 && cleanup_status=1
            if [ "$cleanup_status" -eq 0 ]; then
              {
                echo "system_uninstall_cleanup=passed"
                echo "pre_remove_config_preservation=passed"
                echo "runtime_removed=passed"
                echo "launchd_plists_removed=passed"
                echo "service_identity_removed=passed"
                echo "package_receipt_forgotten=passed"
              } > "$proof_root/macos-system-uninstall-cleanup.txt"
              echo "host_runner_uninstall_cleanup=passed" >> "$proof_root/macos-lifecycle-smoke.txt"
            fi
            set -e
            return "$cleanup_status"
          }
          cleanup_on_exit() {
            local primary_status=$?
            local cleanup_status=0
            trap - EXIT
            cleanup_system_install || cleanup_status=$?
            if [ "$primary_status" -ne 0 ]; then
              exit "$primary_status"
            fi
            exit "$cleanup_status"
          }
          trap cleanup_on_exit EXIT

          project/tools/installers/smoke_install_macos.sh "$package" "$proof_root"
          bash project/tools/installers/smoke_macos_upgrade_guards.sh \
            preinstall "$package" "$proof_root"
          installer_status=0
          set +e
          sudo installer -pkg "$package" -target / \
            2>&1 | tee "$proof_root/system-installer.txt"
          installer_status=${PIPESTATUS[0]}
          set -e
          if [ "$installer_status" -ne 0 ]; then
            identity_diagnostic_root="$proof_root/installer-failure-service-identity"
            mkdir -p "$identity_diagnostic_root"
            if sudo dscl . -read /Users/scratchbird >/dev/null 2>&1; then
              sudo id -G scratchbird \
                > "$identity_diagnostic_root/resolved-group-ids.txt" 2>&1 || true
              sudo id -Gn scratchbird \
                > "$identity_diagnostic_root/resolved-group-names.txt" 2>&1 || true
              sudo dscl . -read /Users/scratchbird \
                UniqueID PrimaryGroupID NFSHomeDirectory UserShell IsHidden GeneratedUID \
                > "$identity_diagnostic_root/user-record.txt" 2>&1 || true
              password_marker_exact=false
              if [ "$(sudo dscl . -read /Users/scratchbird Password 2>/dev/null | awk 'NR == 1 { print $2 }')" = '*' ]; then
                password_marker_exact=true
              fi
              service_user_record="$(sudo dscl . -read /Users/scratchbird 2>/dev/null)"
              authentication_authority_present=false
              if printf '%s\n' "$service_user_record" | grep -Eq \
                  '^(AuthenticationAuthority|dsAttrType(Native|Standard):AuthenticationAuthority):'; then
                authentication_authority_present=true
              fi
              shadow_hash_data_present=false
              if printf '%s\n' "$service_user_record" | grep -Eq \
                  '^(ShadowHashData|dsAttrType(Native|Standard):ShadowHashData):'; then
                shadow_hash_data_present=true
              fi
              {
                echo "password_marker_exact=$password_marker_exact"
                echo "authentication_authority_present=$authentication_authority_present"
                echo "shadow_hash_data_present=$shadow_hash_data_present"
              } > "$identity_diagnostic_root/headless-account-contract.txt"
            fi
            if sudo dscl . -read /Groups/scratchbird >/dev/null 2>&1; then
              sudo dscl . -read /Groups/scratchbird \
                PrimaryGroupID GroupMembership GroupMembers NestedGroups GeneratedUID \
                > "$identity_diagnostic_root/group-record.txt" 2>&1 || true
            fi
            exit "$installer_status"
          fi
          bash project/tools/installers/smoke_macos_upgrade_guards.sh \
            postinstall "$package" "$proof_root"
          python_bin="$(command -v python3)"
          [[ "$python_bin" = /* && -x "$python_bin" ]]
          sudo install -d -o root -g scratchbird -m 0750 "$verifier_root"
          for verifier_source in \
            project/tools/release/verify_native_installed_payload.py \
            project/tools/release/stage_native_release_bundle.py; do
            sudo install -o root -g scratchbird -m 0640 \
              "$verifier_source" "$verifier_root/"
          done
          (
            cd /tmp
            sudo -u scratchbird -g scratchbird "$python_bin" \
              "$verifier_root/verify_native_installed_payload.py" \
              /opt/ScratchBird \
              --config-root "/Library/Application Support/ScratchBird" \
              --config-mode system-installed \
              --expected-architecture "${{ matrix.arch }}"
          )
          sudo rm -rf "$verifier_root"
          sudo test ! -e "$verifier_root"
          sudo test ! -L "$verifier_root"
          for root_executable in \
            /opt/ScratchBird/bin/SBlaunch \
            /opt/ScratchBird/libexec/scratchbird-macos-system-install; do
            test "$(sudo stat -f '%Su:%Sg:%Lp' "$root_executable")" = \
              root:wheel:755
            test "$(sudo stat -f '%l' "$root_executable")" = 1
          done
          for launcher_directory in \
            /opt /opt/ScratchBird /opt/ScratchBird/bin \
            /opt/ScratchBird/libexec /Library/LaunchDaemons; do
            test "$(sudo stat -f '%Su:%Sg:%Lp' "$launcher_directory")" = \
              root:wheel:755
          done
          for service_plist in \
            /Library/LaunchDaemons/com.scratchbird.sbsrv.plist \
            /Library/LaunchDaemons/com.scratchbird.sbmgr.plist; do
            test "$(sudo stat -f '%Su:%Sg:%Lp' "$service_plist")" = \
              root:wheel:644
            test "$(sudo stat -f '%l' "$service_plist")" = 1
          done
          set +e
          launcher_refusal="$(/opt/ScratchBird/bin/SBlaunch sbsrv 2>&1)"
          launcher_refusal_status=$?
          set -e
          test "$launcher_refusal_status" -eq 78
          test "$launcher_refusal" = SB_MACOS_LAUNCHER.ROOT_AUTHORITY_REQUIRED
          test "$(sudo stat -f '%Su:%Sg:%Lp' /var/log/scratchbird)" = \
            root:scratchbird:750
          test "$(sudo stat -f '%Su:%Sg:%Lp' /var/log/scratchbird/launchd)" = \
            root:scratchbird:750
          test "$(sudo stat -f '%Su:%Sg:%Lp' /var/log/scratchbird/runtime)" = \
            scratchbird:scratchbird:750
          for log_name in SBsrv.out.log SBsrv.err.log SBmgr.out.log \
            SBmgr.err.log; do
            sudo test ! -L "/var/log/scratchbird/launchd/$log_name"
            test "$(sudo stat -f '%Su:%Sg:%Lp' "/var/log/scratchbird/launchd/$log_name")" = \
              root:scratchbird:640
            test "$(sudo stat -f '%l' "/var/log/scratchbird/launchd/$log_name")" = 1
          done
          for authority_path in \
            /opt /opt/ScratchBird /opt/ScratchBird/bin \
            /opt/ScratchBird/libexec \
            /opt/ScratchBird/bin/SBlaunch \
            /opt/ScratchBird/libexec/scratchbird-macos-system-install \
            /Library/LaunchDaemons \
            /Library/LaunchDaemons/com.scratchbird.sbsrv.plist \
            /Library/LaunchDaemons/com.scratchbird.sbmgr.plist \
            /var/log/scratchbird /var/log/scratchbird/launchd \
            /var/log/scratchbird/runtime \
            /var/log/scratchbird/launchd/SBsrv.out.log \
            /var/log/scratchbird/launchd/SBsrv.err.log \
            /var/log/scratchbird/launchd/SBmgr.out.log \
            /var/log/scratchbird/launchd/SBmgr.err.log; do
            sudo test ! -L "$authority_path"
            acl_mode="$(sudo ls -lde "$authority_path" | awk 'NR == 1 { print $1 }')"
            case "$acl_mode" in
              ''|*+*) echo "Unexpected macOS ACL: $authority_path" >&2; exit 1 ;;
            esac
          done
          sudo test ! -e /var/log/scratchbird/runtime/SBsrv.log
          sudo test ! -L /var/log/scratchbird/runtime/SBsrv.log
          sudo test ! -e /var/log/scratchbird/runtime/SBmgr.log
          sudo test ! -L /var/log/scratchbird/runtime/SBmgr.log
          python3 - /Library/LaunchDaemons <<'PY'
          import pathlib
          import plistlib
          import sys

          root = pathlib.Path(sys.argv[1])
          expected = {
              "com.scratchbird.sbsrv": "sbsrv",
              "com.scratchbird.sbmgr": "sbmgr",
          }
          for label, selector in expected.items():
              data = plistlib.loads((root / f"{label}.plist").read_bytes())
              if data.get("UserName") != "root" or data.get("GroupName") != "wheel":
                  raise SystemExit(f"macos_system_launchd_identity_mismatch:{label}")
              if data.get("ProgramArguments") != [
                  "/opt/ScratchBird/bin/SBlaunch",
                  selector,
              ]:
                  raise SystemExit(f"macos_system_launchd_selector_mismatch:{label}")
              if data.get("InitGroups") is not False:
                  raise SystemExit(f"macos_system_launchd_init_groups_mismatch:{label}")
              if data.get("Disabled") is not True:
                  raise SystemExit(f"macos_system_launchd_not_disabled:{label}")
              if data.get("RunAtLoad") is not False or data.get("KeepAlive") is not False:
                  raise SystemExit(f"macos_system_launchd_activity_mismatch:{label}")
          PY
          for label in com.scratchbird.sbsrv com.scratchbird.sbmgr; do
            if /bin/launchctl print "system/$label" >/dev/null 2>&1; then
              echo "System package unexpectedly loaded $label." >&2
              exit 1
            else
              test "$?" -eq 113
            fi
          done
          inventory_path="$proof_root/macos-system-filesystem-inventory.txt"
          forbidden_path="$proof_root/macos-system-forbidden-artifacts.txt"
          sudo find /var/lib/scratchbird -xdev -type f -print \
            | LC_ALL=C sort > "$inventory_path"
          sudo find /var/lib/scratchbird -xdev -type f \
            \( -iname '*.sbdb' -o -iname '*.sbrd' \
               -o -iname '*security_principal_events*' \
               -o -iname '*local_password_auth*' \) -print \
            | LC_ALL=C sort > "$forbidden_path"
          if [ -s "$forbidden_path" ]; then
            echo "System package created a database or security sidecar:" >&2
            cat "$forbidden_path" >&2
            exit 1
          fi
          inventory_count="$(wc -l < "$inventory_path" | tr -d '[:space:]')"
          {
            echo "inventory_root=/var/lib/scratchbird"
            echo "inventory_file=$inventory_path"
            echo "inventory_file_count=$inventory_count"
            echo "forbidden_patterns=*.sbdb,*.sbrd,*security_principal_events*,*local_password_auth*"
            echo "forbidden_matches=0"
            echo "database_files_created=false"
            echo "security_sidecars_created=false"
          } > "$proof_root/macos-system-database-security-proof.txt"
          pkgutil --pkg-info com.scratchbird.cde > "$proof_root/pkg-receipt.txt"
          sudo cat /var/lib/scratchbird/install/MACOS_SYSTEM_INSTALL_STATE.json \
            > "$proof_root/MACOS_SYSTEM_INSTALL_STATE.json"
          python3 - "$proof_root/MACOS_SYSTEM_INSTALL_STATE.json" <<'PY'
          import json
          import sys

          state = json.load(open(sys.argv[1], encoding="utf-8"))
          expected = {
              "service_user": "scratchbird",
              "service_group": "scratchbird",
              "service_password_record_locked": True,
              "service_authentication_authority_present": False,
              "service_shadow_hash_data_present": False,
              "service_administrator_group_membership": False,
              "service_group_membership_policy": "exact_scratchbird_name_and_generated_uid_only_no_nested_groups",
              "resolved_effective_group_policy": "launchd_host_computed_groups_cleared_before_scratchbird_product_exec",
              "launchd_init_groups": False,
              "launchd_bootstrap_identity": "root:wheel",
              "service_launcher": "/opt/ScratchBird/bin/SBlaunch",
              "final_product_identity": "scratchbird:scratchbird",
              "final_supplementary_groups_empty": True,
              "service_enablement_default": "disabled",
              "service_activity_default": "not_started",
              "launchd_load_performed": False,
              "native_default_port": 3092,
              "database_files_created": False,
              "security_sidecars_created": False,
          }
          for key, value in expected.items():
              if state.get(key) != value:
                  raise SystemExit(f"macos_system_state_mismatch:{key}")
          PY
          authority_probe="$GITHUB_WORKSPACE/build/bootstrap-probes/sb_bootstrap_os_authority_tests-${{ matrix.arch }}"
          sudo "$authority_probe" --verify-installed-service-identity \
            "/Library/Application Support/ScratchBird/SBbootstrap.profile" \
            | tee "$proof_root/bootstrap-os-authority.txt"
          grep -Fx 'installed_service_identity_assumption=passed' \
            "$proof_root/bootstrap-os-authority.txt"
          bash project/tools/installers/smoke_macos_launchd_credential.sh \
            "$authority_probe" \
            "/Library/Application Support/ScratchBird/SBbootstrap.profile" \
            "$proof_root"
          grep -Fx 'launchd_service_process_credential=passed' \
            "$proof_root/launchd-service-credential.txt"
          grep -Fx 'effective_user=scratchbird' \
            "$proof_root/launchd-service-credential.txt"
          grep -Fx 'effective_group=scratchbird' \
            "$proof_root/launchd-service-credential.txt"
          grep -Fx 'supplementary_group_policy=exact_scratchbird_only' \
            "$proof_root/launchd-service-credential.txt"
          grep -Eq '^group_access_list_count=[0-9]+$' \
            "$proof_root/launchd-service-credential.txt"
          grep -Fx 'group_access_list_policy=effective_gid_only' \
            "$proof_root/launchd-service-credential.txt"
          grep -Fx 'additional_supplementary_group_count=0' \
            "$proof_root/launchd-service-credential.txt"
          grep -Fx 'host_computed_authority_canaries=refused' \
            "$proof_root/launchd-service-credential.txt"
          grep -Eq '^host_computed_authority_canary_count=[1-9][0-9]*$' \
            "$proof_root/launchd-service-credential.txt"
          grep -Fx 'bootstrap_authority_regain=refused' \
            "$proof_root/launchd-service-credential.txt"
          service_shell="$(sudo dscl . -read /Users/scratchbird UserShell | awk 'NR == 1 { print $2 }')"
          service_home="$(sudo dscl . -read /Users/scratchbird NFSHomeDirectory | awk 'NR == 1 { print $2 }')"
          service_hidden="$(sudo dscl . -read /Users/scratchbird IsHidden | awk 'NR == 1 { print $2 }')"
          service_password="$(sudo dscl . -read /Users/scratchbird Password | awk 'NR == 1 { print $2 }')"
          service_user_record="$(sudo dscl . -read /Users/scratchbird)"
          if printf '%s\n' "$service_user_record" | grep -Eq \
              '^(AuthenticationAuthority|ShadowHashData|dsAttrType(Native|Standard):(AuthenticationAuthority|ShadowHashData)):'; then
            echo "ScratchBird service account has an authentication or shadow-hash record." >&2
            exit 1
          fi
          host_user="$(id -un)"
          sudo dseditgroup -n . -o checkmember -m "$host_user" scratchbird \
            > "$proof_root/host-user-group-membership.txt" 2>&1 || true
          if grep -Eq '^yes([[:space:]]|$)' "$proof_root/host-user-group-membership.txt"; then
            echo "System package granted the hosted runner user service-group membership." >&2
            exit 1
          fi
          grep -Eq '^no([[:space:]]|$)' "$proof_root/host-user-group-membership.txt"
          test "$service_shell" = /usr/bin/false
          test "$service_home" = /var/lib/scratchbird
          test "$service_hidden" = 1
          test "$service_password" = '*'

          sudo dscl . -create /Users/scratchbird AuthenticationAuthority \
            ';ScratchBirdRegressionAuth;'
          set +e
          authentication_surface_result="$(sudo \
            /opt/ScratchBird/libexec/scratchbird-macos-system-install \
            post-install --identity-mode system --package-format pkg \
            --package-version "$SB_INSTALLER_VERSION" 2>&1)"
          authentication_surface_status=$?
          set -e
          sudo dscl . -delete /Users/scratchbird AuthenticationAuthority
          test "$authentication_surface_status" -ne 0
          test "$authentication_surface_result" = BOOTSTRAP.GROUP_INPUT_INVALID
          sudo /opt/ScratchBird/libexec/scratchbird-macos-system-install \
            post-install --identity-mode system --package-format pkg \
            --package-version "$SB_INSTALLER_VERSION"
          {
            echo "system_install=passed"
            echo "service_user=scratchbird"
            echo "service_shell=$service_shell"
            echo "service_home=$service_home"
            echo "service_hidden=$service_hidden"
            echo "service_password_record=literal_asterisk_lock"
            echo "service_authentication_authority=absent"
            echo "service_shadow_hash_data=absent"
            echo "authentication_authority_existing_account=refused"
            echo "host_user_group_admission=not_performed"
            echo "bootstrap_authority_identity_drop=passed"
            echo "launchd_process_credential=passed"
            echo "launchd_bootstrap_identity=root:wheel"
            echo "service_launcher=/opt/ScratchBird/bin/SBlaunch"
            echo "final_product_identity=scratchbird:scratchbird"
            echo "group_access_list_policy=effective_gid_only"
            echo "additional_supplementary_group_count=0"
            echo "supplementary_group_policy=exact_scratchbird_only"
            echo "host_computed_authority_canaries=refused"
            echo "launchd_default_state=disabled_not_loaded"
          } > "$proof_root/macos-system-identity.txt"

      - name: Collect macOS installer diagnostics
        if: always()
        run: |
          diagnostic_root="build/install-smoke/macos-${{ matrix.arch }}-installer-diagnostics"
          mkdir -p "$diagnostic_root"
          if sudo test -f /var/log/install.log; then
            sudo tail -n 4000 /var/log/install.log \
              > "$diagnostic_root/install.log" || true
          fi

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scratchbird-macos-${{ matrix.arch }}-installers
          path: build/installers/macos-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS install smoke proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scratchbird-macos-${{ matrix.arch }}-install-smoke
          path: build/install-smoke
          if-no-files-found: warn
          retention-days: 14

  macos-universal-installers:
    name: macOS universal QA installer bundle
    needs: macos-installers
    if: ${{ success() && (inputs.platform == 'all' || inputs.platform == 'macos' || inputs.platform == '') }}
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download per-architecture macOS installers
        uses: actions/download-artifact@v4
        with:
          pattern: scratchbird-macos-*-installers
          path: build/universal-input

      - name: Assemble universal QA tarball
        run: |
          x86_tar="$(find build/universal-input -path '*x86_64*' -name 'scratchbird-macos-*.tar.gz' | head -n 1)"
          arm_tar="$(find build/universal-input -path '*arm64*' -name 'scratchbird-macos-*.tar.gz' | head -n 1)"
          test -n "$x86_tar"
          test -n "$arm_tar"
          python3 project/tools/installers/make_macos_universal.py \
            --x86-tar "$x86_tar" \
            --arm-tar "$arm_tar" \
            --output-root build/installers/macos-universal \
            --version "$SB_INSTALLER_VERSION-universal" \
            --build-id "${{ github.run_id }}-universal"

      - name: Smoke universal tarball
        run: |
          archive="$(ls build/installers/macos-universal/scratchbird-macos-universal-*.tar.gz | head -n 1)"
          project/tools/installers/smoke_install_macos.sh "$archive" build/install-smoke/macos-universal-tar

      - name: Upload universal macOS QA artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scratchbird-macos-universal-installers
          path: build/installers/macos-universal
          if-no-files-found: error
          retention-days: 14
