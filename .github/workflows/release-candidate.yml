name: ScratchBird Release Candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to create or update
        required: true
        default: beta-candidate
      version:
        description: Version for generated installers
        required: true
        default: 0.0.0-candidate
      draft:
        description: Create as draft release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-installers:
    name: Build release-candidate installers
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/verify-installers.yml
    with:
      platform: all
      version: ${{ inputs.version }}

  publish:
    name: Publish draft release candidate
    needs: build-installers
    if: ${{ success() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Require protected-main release context
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Download Linux installer artifact
        uses: actions/download-artifact@v4
        with:
          name: scratchbird-linux-installers
          path: release-artifacts/scratchbird-linux-installers

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: scratchbird-windows-installers
          path: release-artifacts/scratchbird-windows-installers

      - name: Download macOS x86_64 installer artifact
        uses: actions/download-artifact@v4
        with:
          name: scratchbird-macos-x86_64-installers
          path: release-artifacts/scratchbird-macos-x86_64-installers

      - name: Download macOS arm64 installer artifact
        uses: actions/download-artifact@v4
        with:
          name: scratchbird-macos-arm64-installers
          path: release-artifacts/scratchbird-macos-arm64-installers

      - name: Download macOS universal installer artifact
        uses: actions/download-artifact@v4
        with:
          name: scratchbird-macos-universal-installers
          path: release-artifacts/scratchbird-macos-universal-installers

      - name: Verify downloaded installers
        run: |
          set -euo pipefail
          resolve_installer_root() {
            local artifact_dir="$1"
            mapfile -t manifests < <(find "$artifact_dir" -type f -name INSTALLER_ARTIFACT_MANIFEST.json | sort)
            if [ "${#manifests[@]}" -ne 1 ]; then
              echo "Expected exactly one installer manifest in $artifact_dir; found ${#manifests[@]}." >&2
              return 1
            fi
            dirname "${manifests[0]}"
          }
          linux_root="$(resolve_installer_root release-artifacts/scratchbird-linux-installers)"
          windows_root="$(resolve_installer_root release-artifacts/scratchbird-windows-installers)"
          macos_x86_root="$(resolve_installer_root release-artifacts/scratchbird-macos-x86_64-installers)"
          macos_arm_root="$(resolve_installer_root release-artifacts/scratchbird-macos-arm64-installers)"
          python3 project/tools/installers/verify_installer_artifacts.py --platform linux --artifact-root "$linux_root"
          python3 project/tools/installers/verify_installer_artifacts.py --platform windows --artifact-root "$windows_root"
          python3 project/tools/installers/verify_installer_artifacts.py --platform macos --artifact-root "$macos_x86_root"
          python3 project/tools/installers/verify_installer_artifacts.py --platform macos --artifact-root "$macos_arm_root"
          mapfile -t universal_manifests < <(find release-artifacts/scratchbird-macos-universal-installers -type f -name MACOS_UNIVERSAL_ARTIFACT_MANIFEST.json | sort)
          if [ "${#universal_manifests[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS universal manifest; found ${#universal_manifests[@]}." >&2
            exit 1
          fi

      - name: Create verified native-only release-candidate assets
        env:
          SB_RC_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$SB_RC_VERSION" =~ ^[0-9A-Za-z]([0-9A-Za-z.+~_-]*[0-9A-Za-z])?$ ]]; then
            echo "Release-candidate version contains unsupported characters." >&2
            exit 1
          fi
          python3 project/tools/installers/create_nightly_release_bundle.py \
            --input-root release-artifacts \
            --output-root validated-portable-assets \
            --version "$SB_RC_VERSION" \
            --source-revision "$GITHUB_SHA" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT"
          (
            cd validated-portable-assets
            sha256sum --check --strict scratchbird-nightly-SHA256SUMS
          )

          mkdir release-candidate-assets
          install -m 0644 validated-portable-assets/scratchbird-nightly-linux-x86_64.tar.gz \
            "release-candidate-assets/scratchbird-${SB_RC_VERSION}-linux-x86_64.tar.gz"
          install -m 0644 validated-portable-assets/scratchbird-nightly-windows-x86_64.zip \
            "release-candidate-assets/scratchbird-${SB_RC_VERSION}-windows-x86_64.zip"
          install -m 0644 validated-portable-assets/scratchbird-nightly-macos-x86_64.tar.gz \
            "release-candidate-assets/scratchbird-${SB_RC_VERSION}-macos-x86_64.tar.gz"
          install -m 0644 validated-portable-assets/scratchbird-nightly-macos-arm64.tar.gz \
            "release-candidate-assets/scratchbird-${SB_RC_VERSION}-macos-arm64.tar.gz"
          install -m 0644 validated-portable-assets/scratchbird-nightly-macos-universal.tar.gz \
            "release-candidate-assets/scratchbird-${SB_RC_VERSION}-macos-universal.tar.gz"
          (
            cd release-candidate-assets
            sha256sum \
              "scratchbird-${SB_RC_VERSION}-linux-x86_64.tar.gz" \
              "scratchbird-${SB_RC_VERSION}-windows-x86_64.zip" \
              "scratchbird-${SB_RC_VERSION}-macos-x86_64.tar.gz" \
              "scratchbird-${SB_RC_VERSION}-macos-arm64.tar.gz" \
              "scratchbird-${SB_RC_VERSION}-macos-universal.tar.gz" \
              > "scratchbird-${SB_RC_VERSION}-SHA256SUMS"
            sha256sum --check --strict "scratchbird-${SB_RC_VERSION}-SHA256SUMS"
          )
          test "$(find release-candidate-assets -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 6
          test "$(find release-candidate-assets -mindepth 1 -maxdepth 1 | wc -l)" -eq 6

      - name: Create or update release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          SB_RC_DRAFT: ${{ inputs.draft }}
          SB_RC_TAG: ${{ inputs.tag }}
          SB_RC_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$SB_RC_TAG" =~ ^[0-9A-Za-z] ]]; then
            echo "Release-candidate tag must begin with an ASCII letter or digit." >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$SB_RC_TAG"
          gh release delete "$SB_RC_TAG" --yes || true
          git tag -f "$SB_RC_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$SB_RC_TAG" --force
          release_flags=(--prerelease)
          if [ "$SB_RC_DRAFT" = "true" ]; then
            release_flags+=(--draft)
          fi
          assets=(
            "release-candidate-assets/scratchbird-${SB_RC_VERSION}-linux-x86_64.tar.gz"
            "release-candidate-assets/scratchbird-${SB_RC_VERSION}-windows-x86_64.zip"
            "release-candidate-assets/scratchbird-${SB_RC_VERSION}-macos-x86_64.tar.gz"
            "release-candidate-assets/scratchbird-${SB_RC_VERSION}-macos-arm64.tar.gz"
            "release-candidate-assets/scratchbird-${SB_RC_VERSION}-macos-universal.tar.gz"
            "release-candidate-assets/scratchbird-${SB_RC_VERSION}-SHA256SUMS"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done
          test "$(find release-candidate-assets -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq "${#assets[@]}"
          gh release create "$SB_RC_TAG" "${assets[@]}" \
            --title "ScratchBird $SB_RC_VERSION" \
            --notes "Native-only release candidate generated from $GITHUB_SHA. Public assets are exact manifest-derived portable archives only; DEB, AUR, RPM, PKG, and MSI system-installer formats remain internal build outputs and are not downloadable release assets." \
            "${release_flags[@]}"
