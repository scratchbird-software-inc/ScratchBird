name: ScratchBird Nightly Installers

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: Version suffix for generated nightly installers
        required: true
        default: 0.0.0-nightly
      publish-mode:
        description: Publication mode
        required: true
        default: artifacts-only
        type: choice
        options:
          - artifacts-only
          - rolling-prerelease
      require-msi:
        description: Require WiX MSI generation on Windows
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nightly-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gold-gate:
    name: Windows gold nightly enablement gate
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.enabled.outputs.value }}
      version: ${{ steps.version.outputs.value }}
      publish-mode: ${{ steps.publish.outputs.value }}
      require-msi: ${{ steps.msi.outputs.value }}
    steps:
      - name: Check scheduled-nightly enablement
        id: enabled
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ vars.SB_NIGHTLY_INSTALLERS_ENABLED }}" != "true" ]; then
            echo "Scheduled nightly installers are disabled until SB_NIGHTLY_INSTALLERS_ENABLED is true."
            echo "value=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "value=true" >> "$GITHUB_OUTPUT"

      - name: Resolve version
        id: version
        run: echo "value=${{ inputs.version || '0.0.0-nightly' }}" >> "$GITHUB_OUTPUT"

      - name: Resolve publish mode
        id: publish
        run: echo "value=${{ inputs['publish-mode'] || 'artifacts-only' }}" >> "$GITHUB_OUTPUT"

      - name: Resolve MSI policy
        id: msi
        run: echo "value=${{ inputs['require-msi'] || false }}" >> "$GITHUB_OUTPUT"

  build-installers:
    name: Build and verify nightly installers
    needs: gold-gate
    if: ${{ needs.gold-gate.outputs.enabled == 'true' }}
    # Uses build_installers.py through the shared installer verification workflow.
    uses: ./.github/workflows/verify-installers.yml
    with:
      platform: all
      version: ${{ needs.gold-gate.outputs.version }}
      require-msi: ${{ needs.gold-gate.outputs.require-msi == 'true' }}

  publish-nightly:
    name: Publish rolling nightly prerelease
    needs:
      - gold-gate
      - build-installers
    if: ${{ needs.gold-gate.outputs.enabled == 'true' && needs.gold-gate.outputs.publish-mode == 'rolling-prerelease' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: nightly-artifacts

      - name: Verify downloaded installers
        run: |
          linux_root="$(find nightly-artifacts/scratchbird-linux-installers -name INSTALLER_ARTIFACT_MANIFEST.json -exec dirname {} \; | head -n 1)"
          windows_root="$(find nightly-artifacts/scratchbird-windows-installers -name INSTALLER_ARTIFACT_MANIFEST.json -exec dirname {} \; | head -n 1)"
          python3 project/tools/installers/verify_installer_artifacts.py --platform linux --artifact-root "$linux_root"
          python3 project/tools/installers/verify_installer_artifacts.py --platform windows --artifact-root "$windows_root"
          while IFS= read -r macos_manifest; do
            macos_root="$(dirname "$macos_manifest")"
            python3 project/tools/installers/verify_installer_artifacts.py --platform macos --artifact-root "$macos_root"
          done < <(find nightly-artifacts -path '*scratchbird-macos-*-installers*' -name INSTALLER_ARTIFACT_MANIFEST.json | sort)

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="nightly"
          title="ScratchBird Nightly Installers"
          gh release delete "$tag" --yes || true
          git tag -f "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag" --force
          mapfile -t assets < <(find nightly-artifacts -type f | sort)
          gh release create "$tag" "${assets[@]}" \
            --title "$title" \
            --notes "Automated nightly installer build for $GITHUB_SHA." \
            --prerelease
