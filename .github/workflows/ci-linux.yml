name: ScratchBird Linux CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SB_CI_RELEASE_LABELS: "^(public_release_correctness|engine_listener_enterprise)$"
  SB_CI_PROCESS_LABELS: "^(integration|e2e|live_server|process_kill|database_lifecycle_server_route)$"
  SB_CI_SOURCE_TOKEN_LABELS: "^source_token_check$"

jobs:
  static-policy:
    name: Linux repository and static policy
    if: ${{ github.event_name != 'pull_request' || vars.SB_LINUX_CI_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Repository and static release gates
        run: |
          mkdir -p build/ci-logs/linux-static
          set -o pipefail
          {
            status=0
            python3 project/tools/release/public_packaging_history_gate.py || status=1
            python3 project/tools/release/github_actions_static_gate.py || status=1
            python3 project/tools/release/public_private_reference_scan.py || status=1
            python3 project/tools/release/implementation_maturity_gate.py || status=1
            python3 project/tests/fuzz/public_durable_codec_fuzz_coverage_inventory.py --project-root project --output build/ci-logs/linux-static/fuzz-coverage-inventory.json || status=1
            python3 project/tests/fault_injection/public_crash_fault_source_contract_matrix.py --project-root project --output build/ci-logs/linux-static/crash-fault-source-contract.json || status=1
            python3 project/tests/soak/public_release_soak_coverage_inventory.py --project-root project --output build/ci-logs/linux-static/soak-coverage-inventory.json || status=1
            python3 -m unittest discover -s project/tests/repository_policy -p 'test_*.py' || status=1
            exit "$status"
          } 2>&1 | tee build/ci-logs/linux-static/static-policy.log
      - name: Stage Linux static-policy proof
        if: always()
        run: |
          python3 project/tools/release/stage_textual_failure_proof.py \
            --source build/ci-logs/linux-static \
            --output-root build/failure-proofs/linux-static
      - name: Upload Linux static-policy proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scratchbird-linux-static-policy-proof
          path: build/failure-proofs/linux-static
          if-no-files-found: error
          retention-days: 14

  build:
    name: Linux configure and compile
    if: ${{ github.event_name != 'pull_request' || vars.SB_LINUX_CI_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install build dependencies
        run: bash project/tools/ci/install_linux_release_dependencies.sh
      - name: Configure
        working-directory: project
        run: |
          mkdir -p ../build/ci-logs/linux-build
          set -o pipefail
          cmake --preset public-release-linux 2>&1 | tee ../build/ci-logs/linux-build/configure.log
      - name: Record LLVM version and configured runtime resolution
        working-directory: project
        run: |
          set -euo pipefail
          llvm_config="$(command -v llvm-config-23)"
          llvm_version="$("$llvm_config" --version)"
          llvm_major="${llvm_version%%.*}"
          test "$llvm_major" -ge 23
          llvm_cmake_dir="$("$llvm_config" --cmakedir)"
          test -d "$llvm_cmake_dir"
          cache="../build/public-release-linux/CMakeCache.txt"
          test -f "$cache"
          cache_value() {
            local key="$1"
            local line
            line="$(grep -E "^${key}:[^=]+=" "$cache" | tail -n 1 || true)"
            if [ -z "$line" ]; then
              echo "Missing configured LLVM evidence key: $key" >&2
              return 1
            fi
            printf '%s\n' "${line#*=}"
          }
          configured_llvm_dir="$(cache_value LLVM_DIR)"
          configured_library="$(cache_value SB_LLVM_LIBRARY)"
          configured_runtime="$(cache_value SB_LLVM_RUNTIME_LIBRARY_RESOLVED)"
          configured_delivery="$(cache_value SB_LLVM_RUNTIME_DELIVERY)"
          configured_minimum="$(cache_value SB_LLVM_MIN_MAJOR)"
          test -d "$configured_llvm_dir"
          test -f "$configured_library"
          test "$configured_minimum" -ge 23
          test "$configured_delivery" = system-package
          [[ "$configured_runtime" =~ ^libLLVM(-[0-9]+)?[.]so([.][0-9]+)*$ ]]
          [[ "$configured_runtime" != */* ]]
          {
            echo "### Linux LLVM release configuration"
            echo
            echo "- llvm-config: \`$llvm_config\`"
            echo "- LLVM version: \`$llvm_version\`"
            echo "- LLVM CMake package: \`$configured_llvm_dir\`"
            echo "- Configured build library: \`$configured_library\`"
            echo "- Installed runtime reference: \`$configured_runtime\`"
            echo "- Runtime delivery: \`$configured_delivery\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build
        working-directory: project
        run: |
          set -o pipefail
          cmake --build --preset public-release-linux 2>&1 | tee ../build/ci-logs/linux-build/build.log
      - name: Stage bounded configured Linux build handoff
        run: |
          python3 project/tools/ci/stage_ci_build_handoff.py \
            --test-dir build/public-release-linux \
            --platform linux \
            --include-label "$SB_CI_RELEASE_LABELS" \
            --output-root build/ci-handoff/linux
      - name: Archive configured Linux build handoff
        run: |
          mkdir -p build/ci-artifacts
          set -o pipefail
          tar -cf - -C build/ci-handoff/linux . | \
            zstd -T0 -3 --long=27 -o build/ci-artifacts/public-release-linux.tar.zst
      - name: Upload configured Linux build
        uses: actions/upload-artifact@v4
        with:
          name: scratchbird-linux-configured-build
          path: build/ci-artifacts/public-release-linux.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Stage Linux compile proof
        if: always()
        run: |
          python3 project/tools/release/stage_textual_failure_proof.py \
            --source build/ci-logs/linux-build \
            --source build/public-release-linux/Testing \
            --output-root build/failure-proofs/linux-build
      - name: Upload Linux compile proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scratchbird-linux-compile-proof
          path: build/failure-proofs/linux-build
          if-no-files-found: error
          retention-days: 14

  unit-runtime-tests:
    name: Linux unit and runtime tests
    needs: build
    if: ${{ always() && needs.build.result == 'success' && (github.event_name != 'pull_request' || vars.SB_LINUX_CI_ENABLED == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install test dependencies
        run: bash project/tools/ci/install_linux_release_dependencies.sh
      - name: Download configured Linux build
        uses: actions/download-artifact@v4
        with:
          name: scratchbird-linux-configured-build
          path: build/ci-artifacts
      - name: Restore configured Linux build
        run: |
          set -o pipefail
          zstd -dc build/ci-artifacts/public-release-linux.tar.zst | tar -xf -
      - name: Run Linux unit and runtime partition
        working-directory: project
        run: |
          python3 tools/ci/run_ctest_chunks.py \
            --preset public-release-linux --chunk-count 8 --timeout 900 \
            --include-label "$SB_CI_RELEASE_LABELS" \
            --exclude-label "$SB_CI_PROCESS_LABELS" \
            --exclude-label "$SB_CI_SOURCE_TOKEN_LABELS" \
            --output-root ../build/ctest-chunks/linux-unit-runtime
      - name: Stage Linux unit-runtime proof
        if: always()
        run: |
          python3 project/tools/release/stage_textual_failure_proof.py \
            --source build/ctest-chunks/linux-unit-runtime \
            --source build/public-release-linux/Testing \
            --output-root build/failure-proofs/linux-unit-runtime
      - name: Upload Linux unit-runtime proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scratchbird-linux-unit-runtime-proof
          path: build/failure-proofs/linux-unit-runtime
          if-no-files-found: error
          retention-days: 14

  process-integration-tests:
    name: Linux process and integration tests
    needs: build
    if: ${{ always() && needs.build.result == 'success' && (github.event_name != 'pull_request' || vars.SB_LINUX_CI_ENABLED == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install test dependencies
        run: bash project/tools/ci/install_linux_release_dependencies.sh
      - name: Download configured Linux build
        uses: actions/download-artifact@v4
        with:
          name: scratchbird-linux-configured-build
          path: build/ci-artifacts
      - name: Restore configured Linux build
        run: |
          set -o pipefail
          zstd -dc build/ci-artifacts/public-release-linux.tar.zst | tar -xf -
      - name: Run Linux process and integration partition
        working-directory: project
        run: |
          python3 tools/ci/run_ctest_chunks.py \
            --preset public-release-linux --chunk-count 4 --timeout 900 \
            --include-label "$SB_CI_RELEASE_LABELS" \
            --require-label "$SB_CI_PROCESS_LABELS" \
            --output-root ../build/ctest-chunks/linux-process-integration
      - name: Stage Linux process-integration proof
        if: always()
        run: |
          python3 project/tools/release/stage_textual_failure_proof.py \
            --source build/ctest-chunks/linux-process-integration \
            --source build/public-release-linux/Testing \
            --output-root build/failure-proofs/linux-process-integration
      - name: Upload Linux process-integration proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scratchbird-linux-process-integration-proof
          path: build/failure-proofs/linux-process-integration
          if-no-files-found: error
          retention-days: 14

  packaging:
    name: Linux package verification
    needs: build
    if: ${{ always() && needs.build.result == 'success' && (github.event_name != 'pull_request' || vars.SB_LINUX_CI_ENABLED == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install package verification dependencies
        run: bash project/tools/ci/install_linux_release_dependencies.sh
      - name: Download configured Linux build
        uses: actions/download-artifact@v4
        with:
          name: scratchbird-linux-configured-build
          path: build/ci-artifacts
      - name: Restore configured Linux build
        run: |
          set -o pipefail
          zstd -dc build/ci-artifacts/public-release-linux.tar.zst | tar -xf -
      - name: Verify staged public bundle
        run: |
          mkdir -p build/ci-logs/linux-package
          set -o pipefail
          python3 project/tools/release/verify_public_release_bundle.py \
            build/public-release-linux/output/linux 2>&1 | tee build/ci-logs/linux-package/public-bundle.log
      - name: Stage and verify native-only SB bundle
        run: |
          set -o pipefail
          {
            python3 project/tools/release/stage_native_release_bundle.py \
              --source-root build/public-release-linux/output/linux \
              --output-root build/native-release-linux/output/linux \
              --platform linux
            python3 project/tools/release/verify_public_release_bundle.py build/native-release-linux/output/linux
            python3 project/tools/release/verify_native_release_bundle.py build/native-release-linux/output/linux --platform linux
            cmake -E remove_directory build/public-release-linux/output/linux
          } 2>&1 | tee build/ci-logs/linux-package/native-bundle.log
      - name: Stage Linux packaging proof
        if: always()
        run: |
          python3 project/tools/release/stage_textual_failure_proof.py \
            --source build/ci-logs/linux-package \
            --output-root build/failure-proofs/linux-packaging
      - name: Upload Linux packaging proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scratchbird-linux-packaging-proof
          path: build/failure-proofs/linux-packaging
          if-no-files-found: error
          retention-days: 14

  public-release-linux:
    name: Public release Linux build and CTest
    needs:
      - static-policy
      - build
      - unit-runtime-tests
      - process-integration-tests
      - packaging
    if: ${{ always() && (github.event_name != 'pull_request' || vars.SB_LINUX_CI_ENABLED == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail-closed Linux release decision
        env:
          STATIC_POLICY_RESULT: ${{ needs.static-policy.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          UNIT_RUNTIME_RESULT: ${{ needs.unit-runtime-tests.result }}
          PROCESS_INTEGRATION_RESULT: ${{ needs.process-integration-tests.result }}
          PACKAGING_RESULT: ${{ needs.packaging.result }}
        run: |
          status=0
          for result in "$STATIC_POLICY_RESULT" "$BUILD_RESULT" "$UNIT_RUNTIME_RESULT" "$PROCESS_INTEGRATION_RESULT" "$PACKAGING_RESULT"; do
            if [ "$result" != success ]; then status=1; fi
          done
          printf 'runtime_observable.unit-runtime-tests=%s\ndurable_reopen=not-separately-qualified\nprocess_level.process-integration-tests=%s\nmodel_property=not-separately-qualified\nstatic_contract.static-policy=%s\nsource_token=included-in-static-policy-non-behavioral\nbuild=%s\npackaging=%s\n' \
            "$UNIT_RUNTIME_RESULT" "$PROCESS_INTEGRATION_RESULT" "$STATIC_POLICY_RESULT" "$BUILD_RESULT" "$PACKAGING_RESULT"
          exit "$status"
