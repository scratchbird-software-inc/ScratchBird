name: ScratchBird Windows CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-release-windows:
    name: Public release Windows build and CTest
    if: ${{ github.event_name != 'pull_request' || vars.SB_WINDOWS_CI_ENABLED == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 240

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-llvm
            mingw-w64-ucrt-x86_64-clang-tools-extra
            mingw-w64-ucrt-x86_64-cppcheck
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-icu
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-lz4
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-geos
            mingw-w64-ucrt-x86_64-proj
            mingw-w64-ucrt-x86_64-gtest

      - name: Static release gates
        shell: bash
        run: |
          python project/tools/release/public_packaging_history_gate.py
          python project/tools/release/github_actions_static_gate.py
          python project/tools/release/public_private_reference_scan.py

      - name: Configure
        working-directory: project
        run: |
          set -euo pipefail
          LLVM_CONFIG="${MINGW_PREFIX:-/ucrt64}/bin/llvm-config"
          if [ ! -x "$LLVM_CONFIG" ]; then
            LLVM_CONFIG="$(command -v llvm-config)"
          fi
          LLVM_CMAKE_DIR="$("$LLVM_CONFIG" --cmakedir)"
          LLVM_LIB_DIR="$("$LLVM_CONFIG" --libdir)"
          LLVM_MAJOR="$("$LLVM_CONFIG" --version | sed -E 's/^([0-9]+).*/\1/')"
          LLVM_REQUIRED_MAJOR=22
          test "$LLVM_MAJOR" -ge "$LLVM_REQUIRED_MAJOR"
          LLVM_BIN_DIR="${MINGW_PREFIX:-/ucrt64}/bin"
          LLVM_LIBRARY="${LLVM_BIN_DIR}/libLLVM-${LLVM_MAJOR}.dll"
          if [ ! -f "$LLVM_LIBRARY" ]; then
            LLVM_LIBRARY="$(find "$LLVM_BIN_DIR" -maxdepth 1 -name "libLLVM-${LLVM_MAJOR}*.dll" | sort | head -n 1)"
          fi
          LLVM_RUNTIME_LIBRARY="$(basename "$LLVM_LIBRARY")"
          test -d "$LLVM_CMAKE_DIR"
          test -f "$LLVM_LIBRARY"
          echo "LLVM_CONFIG=$LLVM_CONFIG"
          echo "LLVM_CMAKE_DIR=$LLVM_CMAKE_DIR"
          echo "LLVM_LIB_DIR=$LLVM_LIB_DIR"
          echo "LLVM_BIN_DIR=$LLVM_BIN_DIR"
          echo "LLVM_LIBRARY=$LLVM_LIBRARY"
          echo "LLVM_RUNTIME_LIBRARY=$LLVM_RUNTIME_LIBRARY"
          echo "LLVM_MAJOR=$LLVM_MAJOR"
          echo "LLVM_REQUIRED_MAJOR=$LLVM_REQUIRED_MAJOR"
          cmake --preset public-release-windows \
            -DLLVM_DIR="$LLVM_CMAKE_DIR" \
            -DSB_LLVM_LIBRARY="$LLVM_LIBRARY" \
            -DSB_LLVM_RUNTIME_LIBRARY="$LLVM_RUNTIME_LIBRARY" \
            -DSB_LLVM_MIN_MAJOR="$LLVM_REQUIRED_MAJOR"

      - name: Build
        working-directory: project
        run: cmake --build --preset public-release-windows

      - name: CTest
        working-directory: project
        run: |
          status=0
          ctest --preset public-release-windows -L public_release_correctness || status=1
          ctest --preset public-release-windows -L engine_listener_enterprise || status=1
          exit "$status"

      - name: Verify staged public bundle
        shell: bash
        run: python project/tools/release/verify_public_release_bundle.py build/public-release-windows/output/windows

      - name: Stage and verify native-only SB bundle
        shell: bash
        run: |
          runtime_search_root="$(cygpath -w "${MINGW_PREFIX:-/ucrt64}/bin")"
          test -d "$runtime_search_root"
          python project/tools/release/stage_native_release_bundle.py \
            --source-root build/public-release-windows/output/windows \
            --output-root build/native-release-windows/output/windows \
            --platform windows \
            --runtime-search-root "$runtime_search_root"
          python project/tools/release/verify_public_release_bundle.py build/native-release-windows/output/windows
          python project/tools/release/verify_native_release_bundle.py \
            build/native-release-windows/output/windows --platform windows
          cmake -E remove_directory build/public-release-windows/output/windows

      - name: Stage Windows textual build proof
        if: always()
        shell: bash
        run: |
          python project/tools/release/stage_textual_failure_proof.py \
            --source build/public-release-windows/Testing \
            --output-root build/failure-proofs/windows

      - name: Upload Windows build proof
        uses: actions/upload-artifact@v4
        if: always()
        with:
          # Failure diagnostics only; this root is generated from bounded
          # text evidence and cannot contain a staged executable payload.
          name: scratchbird-windows-build-proof
          path: build/failure-proofs/windows
          if-no-files-found: warn
          retention-days: 14
